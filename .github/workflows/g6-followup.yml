name: g6-followup
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'feature/g6-coarse-fine-ambiguity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Patch resolver injection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/capitalguard/application/services/historical_market_replay_service.py')
          s=p.read_text()
          # Patch the replay_g6 call only: anchor on the provider_endpoint argument block.
          old='''            data_as_of_status=run.data_as_of_status,\n            refresh_ranking=False,\n        )'''
          new='''            data_as_of_status=run.data_as_of_status,\n            refresh_ranking=False,\n            resolver_client=getattr(provider, "client", None),\n        )'''
          if 'resolver_client=getattr(provider, "client", None)' not in s:
              assert old in s, 'replay_g6 call site not found'
              s=s.replace(old,new,1)
          sig='''        data_as_of_status: str = "UNVERIFIABLE",\n        refresh_ranking: bool = True,\n    ) -> list[HistoricalSignalEvent]:'''
          sig2='''        data_as_of_status: str = "UNVERIFIABLE",\n        refresh_ranking: bool = True,\n        resolver_client=None,\n    ) -> list[HistoricalSignalEvent]:'''
          if '        resolver_client=None,\n    ) -> list[HistoricalSignalEvent]:' not in s:
              assert sig in s, 'replay_candles signature not found'
              s=s.replace(sig,sig2,1)
          old='''                if self.intra_candle_resolver is None:\n                    from capitalguard.infrastructure.market.binance_client import BinanceClient\n                    self.intra_candle_resolver = IntraCandleResolver(BinanceClient())\n                resolution = self.intra_candle_resolver.resolve('''
          new='''                if self.intra_candle_resolver is None and resolver_client is not None and hasattr(resolver_client, "fetch_agg_trades"):\n                    self.intra_candle_resolver = IntraCandleResolver(resolver_client)\n                if self.intra_candle_resolver is None:\n                    ambiguity_status = "AMBIGUOUS"\n                    events.append(self.signal_service.record_event(session, signal_id=signal.id, event_type="AMBIGUOUS", event_timestamp=candle_time, market_as_of=candle_time, data_source=candle.data_source, price=None, replay_status="AMBIGUOUS", event_confidence="0.0000", event_data={"replay_end": end_time.isoformat(), "candle_rule": "NO_FINE_GRAIN_PROVIDER", "possible_events": ["SL", *[f"TP{index}" for index in target_hits]], "high": str(candle.high), "low": str(candle.low), "market_evidence_ref": market_evidence.replay_run_ref if market_evidence else None, "replay_run_id": replay_run_id}, dedup_key=f"{dedup_prefix}:AMBIGUOUS:{candle_time.isoformat()}", replay_run_id=replay_run_id, refresh_ranking=refresh_ranking))\n                    closed = True\n                    continue\n                resolution = self.intra_candle_resolver.resolve('''
          assert old in s, 'resolver construction block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python -m compileall -q src/capitalguard/application/services/historical_market_replay_service.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capitalguard/application/services/historical_market_replay_service.py
          git rm -f .github/workflows/g6-followup.yml
          git commit -m "[g6-upgrade] inject canonical market client into replay"
          git push