name: G6 Remaining Verification
on:
  push:
    branches: [fix/g6-lifecycle-and-historical-result-presentation]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g6-lifecycle-and-historical-result-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fix target-label numeric parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai_service/services/parsing_utils.py')
          s = p.read_text()
          old = '        if re.fullmatch(r"(?:tp|target)\\d*", s, flags=re.IGNORECASE):\n            return None'
          new = '        if re.fullmatch(r"(?:tp|target)\\d*\\s*[:=-]?", s, flags=re.IGNORECASE):\n            return None'
          if old not in s:
              raise SystemExit('target label guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Historical tests after parser fix
        run: pytest -q tests/test_historical_*
      - name: Commit parser fix and remove verifier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_service/services/parsing_utils.py
          git commit -m 'fix(parser): reject labeled target tokens as numeric values'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
          git rm .github/workflows/g6-verification-fixes-2.yml
          git commit -m 'chore(g6): remove temporary remaining verifier'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
