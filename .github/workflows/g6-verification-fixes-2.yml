name: G6 Verification Fixes 2
on:
  push:
    branches: [fix/g6-lifecycle-and-historical-result-presentation]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g6-lifecycle-and-historical-result-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fix G6 coverage aggregation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/capitalguard/application/services/historical_market_replay_service.py')
          s = p.read_text()
          s2 = s.replace('macro_statuses: list[str] = []\n        macro_times = []', 'macro_statuses: list[str] = []\n        minute_statuses: list[str] = []\n        macro_times = []')
          s2 = s2.replace('            macro_statuses.append(minute_coverage.status.value)\n            if minutes:', '            minute_statuses.append(minute_coverage.status.value)\n            if minutes:', 1)
          s2 = s2.replace('                macro_statuses.append(minute_coverage.status.value)\n                if state.activated', '                minute_statuses.append(minute_coverage.status.value)\n                if state.activated', 1)
          old = '        run.coverage_status = "FULL" if macro_statuses and not any(status in {"PARTIAL_WINDOW", "GAPPED", "UNAVAILABLE"} for status in macro_statuses) else ("GAPPED" if "GAPPED" in macro_statuses else "PARTIAL_WINDOW")'
          new = '        coverage_statuses = macro_statuses + (minute_statuses if state.activated else [])\n        run.coverage_status = "FULL" if coverage_statuses and not any(status in {"PARTIAL_WINDOW", "GAPPED", "UNAVAILABLE"} for status in coverage_statuses) else ("GAPPED" if "GAPPED" in coverage_statuses else "PARTIAL_WINDOW")'
          s2 = s2.replace(old, new, 1)
          if s2 == s:
              raise SystemExit('coverage aggregation patch not applied')
          p.write_text(s2)
          PY
      - name: Historical tests after coverage fix
        run: pytest -q tests/test_historical_*
      - name: Commit coverage fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/capitalguard/application/services/historical_market_replay_service.py
          git commit -m 'fix(g6): keep pending orders complete on non-material minute partials'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
      - name: Fix target-label numeric parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai_service/services/parsing_utils.py')
          s = p.read_text()
          old = '        if re.fullmatch(r"(?:tp|target)\\d*", s, flags=re.IGNORECASE):\n            return None'
          new = '        if re.fullmatch(r"(?:tp|target)\\d*\\s*[:=-]?", s, flags=re.IGNORECASE):\n            return None'
          if old not in s:
              raise SystemExit('target-label parser guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Historical tests after parser fix
        run: pytest -q tests/test_historical_*
      - name: Commit parser fix
        run: |
          git add ai_service/services/parsing_utils.py
          git commit -m 'fix(parser): reject labeled target tokens as numeric values'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
      - name: Remove one-shot fixer
        run: |
          git rm .github/workflows/g6-verification-fixes-2.yml
          git commit -m 'chore(g6): remove one-shot verification fixer'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
