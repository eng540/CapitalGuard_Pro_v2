name: C-05 Queue Documentation Fix

on:
  push:
    branches:
      - fix/financial-trading-reality-contract-r2

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'C-05 queue documentation fixed')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path = 'src/capitalguard/application/services/alert_service.py';
            const branch = 'fix/financial-trading-reality-contract-r2';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            const sha = current.data.sha;
            const content = Buffer.from(current.data.content, 'base64').toString('utf8');
            const oldText = '        إذا امتلأ الـ queue → يتجاهل التيك القديم ويضع الجديد.';
            const newText = '        إذا امتلأ الـ queue → يطبّق backpressure ولا يسقط أي تيك.';
            if (!content.includes(oldText)) throw new Error('Expected C-05 stale documentation not found');
            const updated = content.replace(oldText, newText);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'fix: align C-05 queue documentation',
              content: Buffer.from(updated, 'utf8').toString('base64'), sha,
            });
            const workflowPath = '.github/workflows/_c05_doc_fix.yml';
            const workflow = await github.rest.repos.getContent({owner, repo, path: workflowPath, ref: branch});
            await github.rest.repos.deleteFile({
              owner, repo, path: workflowPath, branch,
              message: 'chore: remove temporary C-05 documentation runner',
              sha: workflow.data.sha,
            });