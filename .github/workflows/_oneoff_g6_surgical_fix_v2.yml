name: oneoff-g6-surgical-fix-v2

on:
  push:
    branches:
      - fix/g6-day0-self-heal-direct-20260907
    paths:
      - .github/workflows/_oneoff_g6_surgical_fix_v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical source changes
        shell: python
        run: |
          from pathlib import Path

          rp = Path("src/capitalguard/application/services/historical_market_replay_service.py")
          fp = Path("src/capitalguard/application/services/historical_forwarding_service.py")
          replay = rp.read_text(encoding="utf-8")
          forwarding = fp.read_text(encoding="utf-8")

          old = '''        planner = AdaptiveHistoricalReplayPlanner()\n        macro_start = planner.day_start(self._utc(signal.decision_timestamp))\n        run, created = self._get_or_create_run(\n            session, signal_id=signal_id, materialization_id=materialization_id,\n            start=macro_start, replay_end=end_utc, interval="1m", limit=limit,\n            retry_of_fingerprint=retry_of_fingerprint,\n        )'''
          new = '''        planner = AdaptiveHistoricalReplayPlanner()\n        source_time = self._utc(signal.decision_timestamp)\n        day_zero = planner.day_start(source_time)\n        macro_start = day_zero + timedelta(days=1)\n        run, created = self._get_or_create_run(\n            session, signal_id=signal_id, materialization_id=materialization_id,\n            start=source_time, replay_end=end_utc, interval="1m", limit=limit,\n            retry_of_fingerprint=retry_of_fingerprint,\n        )'''
          assert old in replay
          replay = replay.replace(old, new, 1)

          marker = '''        for annual in planner.annual_windows(macro_start, end_utc):'''
          day0 = '''        # Day-0 is always resolved causally from the exact signal source time.\n        # The daily macro pass starts on the following UTC day.\n        day_zero_window = planner.minute_window_for_day(\n            day=day_zero, signal_source_time=source_time, now=end_utc\n        )\n        if day_zero_window is not None:\n            minute_fetch = getattr(provider, "fetch_minute_day", None)\n            if minute_fetch is None:\n                raise HistoricalSignalValidationError("Adaptive G6 provider lacks critical-day minute adapter")\n            minutes, minute_endpoint, minute_coverage = minute_fetch(\n                asset=str(signal.asset or ""), market=signal.market,\n                start=day_zero_window.start, end=day_zero_window.end,\n            )\n            macro_statuses.append(minute_coverage.status.value)\n            if minutes:\n                drilldown_days.append(day_zero.isoformat())\n                day_events = self.replay_candles(\n                    session, signal_id=signal_id, candles=minutes, replay_end=day_zero_window.end,\n                    interval="1m", provider_endpoint=minute_endpoint, replay_run_id=run.id,\n                    fetched_at=fetched_at, data_as_of_status="UNVERIFIABLE", refresh_ranking=False,\n                    resolver_client=getattr(provider, "client", None), initial_state=state,\n                )\n                all_events.extend(day_events)\n                hit = set(state.hit_target_indices)\n                activated = state.activated\n                lifecycle = state.lifecycle_state\n                last_ts = state.last_processed_timestamp\n                for event in day_events:\n                    event_type = str(event.event_type)\n                    last_ts = event.event_timestamp\n                    if event_type == "ACTIVATED":\n                        activated = True; lifecycle = "ACTIVE"\n                    elif event_type.startswith("TP") and event_type[2:].isdigit():\n                        hit.add(int(event_type[2:])); lifecycle = "CLOSED_TARGETS" if len(hit) == len(target_levels) else "ACTIVE"\n                    elif event_type == "SL":\n                        lifecycle = "CLOSED_STOP"\n                    elif event_type == "CLOSE":\n                        lifecycle = "FINAL_CLOSE"\n                    elif event_type == "AMBIGUOUS":\n                        lifecycle = "CLOSED_UNVERIFIABLE"\n                state = LifecycleState(\n                    activated=activated, hit_target_indices=frozenset(hit),\n                    remaining_target_indices=frozenset(set(range(1, len(target_levels) + 1)) - hit),\n                    current_stop=state.current_stop, lifecycle_state=lifecycle,\n                    last_processed_timestamp=last_ts,\n                )\n\n        for annual in planner.annual_windows(macro_start, end_utc):'''
          assert marker in replay
          replay = replay.replace(marker, day0, 1)
          replay = replay.replace('''            "requested_start": macro_start.isoformat(), "requested_end": end_utc.isoformat(),''', '''            "requested_start": source_time.isoformat(), "requested_end": end_utc.isoformat(),''', 1)

          old = '''                HistoricalReplayRun.status.in_({"COMPLETED", "COMPLETED_UNVERIFIABLE"}),\n            )'''
          new = '''            )'''
          assert old in forwarding
          forwarding = forwarding.replace(old, new, 1)

          old = '''        existing_summary = (batch.metadata_json or {}).get("auto_progression")\n        staged_exists = session.scalar(\n            select(HistoricalForwardReceipt.id).where(\n                HistoricalForwardReceipt.batch_id == batch_id,\n                HistoricalForwardReceipt.validation_status == "STAGED",\n            ).limit(1)\n        ) is not None\n        if not staged_exists and existing_summary:'''
          new = '''        existing_summary = (batch.metadata_json or {}).get("auto_progression")\n        receipts = session.execute(\n            select(HistoricalForwardReceipt)\n            .where(HistoricalForwardReceipt.batch_id == batch_id)\n            .order_by(HistoricalForwardReceipt.id)\n        ).scalars().all()\n        staged_exists = any(receipt.validation_status == "STAGED" for receipt in receipts)\n        duplicate_exists = any(receipt.validation_status == "DUPLICATE" for receipt in receipts)\n        if not staged_exists and not duplicate_exists and existing_summary:'''
          assert old in forwarding
          forwarding = forwarding.replace(old, new, 1)

          old = '''        receipts = session.execute(\n            select(HistoricalForwardReceipt)\n            .where(\n                HistoricalForwardReceipt.batch_id == batch_id\n            )\n            .order_by(HistoricalForwardReceipt.id)\n        ).scalars().all()\n        items: list[dict[str, Any]] = []'''
          if old not in forwarding:
              old = '''        receipts = session.execute(\n            select(HistoricalForwardReceipt)\n            .where(HistoricalForwardReceipt.batch_id == batch_id)\n            .order_by(HistoricalForwardReceipt.id)\n        ).scalars().all()\n        items: list[dict[str, Any]] = []'''
          assert old in forwarding
          forwarding = forwarding.replace(old, '''        items: list[dict[str, Any]] = []''', 1)

          old = '''            if receipt.validation_status == "DUPLICATE":\n                duplicate_count += 1\n                resolution = (receipt.metadata_json or {}).get("duplicate_resolution") or {}\n                replay = resolution.get("replay") or {}'''
          new = '''            if receipt.validation_status == "DUPLICATE":\n                duplicate_count += 1\n                resolution = (receipt.metadata_json or {}).get("duplicate_resolution") or {}\n                if receipt.source_chat_id is not None and receipt.source_message_id is not None:\n                    refreshed = self._duplicate_resolution(\n                        session,\n                        source_chat_id=int(receipt.source_chat_id),\n                        source_message_id=int(receipt.source_message_id),\n                    )\n                    if refreshed is not None:\n                        resolution = refreshed\n                        receipt.metadata_json = {**(receipt.metadata_json or {}), "duplicate_resolution": resolution}\n                        session.flush()\n                replay = resolution.get("replay") or {}\n                replay_status = str(replay.get("replay_status") or "")\n                previous_receipt_id = resolution.get("previous_receipt_id")\n                if replay_status in {"FAILED", "REPLAY_PARTIAL"} and previous_receipt_id:\n                    try:\n                        healed = self.replay_service.retry_g6(session, receipt_id=int(previous_receipt_id), provider=provider)\n                        healed_run = healed.get("run")\n                        if healed_run is not None:\n                            result = dict(healed_run.result_json or {})\n                            events = result.get("events") or []\n                            replay = {\n                                **replay,\n                                "replay_status": str(healed_run.status),\n                                "event_count": result.get("event_count", len(events)),\n                                "last_event": events[-1].get("type") if events else None,\n                                "lifecycle_status": result.get("lifecycle_status"),\n                                "resolution_quality": result.get("resolution_quality"),\n                                "termination_reason": result.get("termination_reason"),\n                                "exit_timestamp": result.get("exit_timestamp"),\n                                "coverage_status": healed_run.coverage_status,\n                                "run_id": healed_run.id,\n                                "run_ref": healed_run.run_ref,\n                            }\n                            resolution["replay"] = replay\n                            receipt.metadata_json = {**(receipt.metadata_json or {}), "duplicate_resolution": resolution}\n                            session.flush()\n                            if str(healed_run.status) not in {"COMPLETED", "COMPLETED_UNVERIFIABLE"}:\n                                failed += 1\n                            else:\n                                replay_statuses.append(str(healed_run.status))\n                    except Exception as exc:\n                        failed += 1\n                        replay = {**replay, "replay_status": "FAILED", "retry_error_type": type(exc).__name__}\n                        resolution["replay"] = replay\n                        receipt.metadata_json = {**(receipt.metadata_json or {}), "duplicate_resolution": resolution}\n                        session.flush()'''
          assert old in forwarding
          forwarding = forwarding.replace(old, new, 1)

          rp.write_text(replay, encoding="utf-8")
          fp.write_text(forwarding, encoding="utf-8")
          compile(rp.read_text(encoding="utf-8"), str(rp), "exec")
          compile(fp.read_text(encoding="utf-8"), str(fp), "exec")
          print("source edits applied and compiled")

      - name: Run targeted verification
        run: |
          python -m compileall -q src/capitalguard
          if [ -d tests ]; then pytest -q tests -k 'historical or replay or forwarding' --maxfail=1; fi

      - name: Commit and remove one-off workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_oneoff_g6_surgical_fix.yml .github/workflows/_oneoff_g6_surgical_fix_v2.yml
          git add src/capitalguard/application/services/historical_market_replay_service.py src/capitalguard/application/services/historical_forwarding_service.py
          git diff --cached --check
          git commit -m "fix(g6): make day-zero causal and self-heal failed duplicates"
          git push origin HEAD
