name: G6 Contract Bootstrap

on:
  push:
    branches:
      - g6-reprocessing-operational-gap-closure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g6-reprocessing-operational-gap-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contract patch
        run: python scripts/_g6_contract_bootstrap.py
      - name: Remove bootstrap tooling
        run: |
          rm -f scripts/_g6_contract_bootstrap.py .github/workflows/_g6_contract_bootstrap.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(g6): implement reprocessing operational gap closure'
          git push origin HEAD:g6-reprocessing-operational-gap-closure
