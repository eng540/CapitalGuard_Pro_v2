name: one-off-g6-presentation-tests
on:
  push:
    branches: [fix/g6-lifecycle-and-historical-result-presentation]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve historical result presentation and add regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/capitalguard/interfaces/telegram/presentation_adapter.py')
          s = p.read_text()
          old = '''        for label, key in (("الحالة", "replay_status"), ("عدد الأحداث", "event_count"), ("آخر حدث", "last_event"), ("دورة الحياة", "lifecycle_status")):\n            value = replay.get(key)\n            if value is not None:\n                lines.append(f"{label}: <code>{_text(value)}</code>")\n        if replay_status == "COMPLETED_UNVERIFIABLE":\n            lines.append("⚠️ اكتملت المحاكاة وتم حسم الإغلاق المالي، مع تعذر التحقق الكامل من ترتيب الصفقات اللحظية داخل بعض الشموع.")\n'''
          new = '''        for label, key in (("الحالة", "replay_status"), ("عدد الأحداث", "event_count"), ("آخر حدث", "last_event"), ("دورة الحياة", "lifecycle_status")):\n            value = replay.get(key)\n            if value is not None:\n                lines.append(f"{label}: <code>{_text(value)}</code>")\n        lifecycle = str(replay.get("lifecycle_status") or "").upper()\n        events = replay.get("events") or []\n        if lifecycle in {"NOT_ACTIVATED", "PENDING_ORDER"}:\n            lines.append("الحالة المالية: <b>أمر معلق — لم يتم تفعيل الدخول</b> ⏳")\n            lines.append("الأثر المالي: <code>0.00%</code> — لم تدخل الصفقة حيز التنفيذ.")\n        elif lifecycle in {"ACTIVE", "ACTIVE_POSITION"}:\n            lines.append("الحالة المالية: <b>مركز مفعّل وما زال مفتوحًا عند نهاية الأفق</b> 🟡")\n        if events:\n            lines.append("📜 <b>السجل المالي (Timeline)</b>")\n            labels = {"ACTIVATED": "دخول/تفعيل", "SL": "وقف الخسارة", "CLOSE": "إغلاق", "AMBIGUOUS": "حدث غير قابل للحسم"}\n            for event in events:\n                if not isinstance(event, Mapping):\n                    continue\n                event_type = str(event.get("type") or "")\n                label = labels.get(event_type, event_type)\n                timestamp = event.get("timestamp")\n                price = event.get("price")\n                detail = f" · السعر <code>{_text(price)}</code>" if price is not None else ""\n                lines.append(f"• {label} · {_text(timestamp)}{detail}")\n        if replay_status == "COMPLETED_UNVERIFIABLE":\n            lines.append("⚠️ اكتملت المحاكاة، لكن ترتيب الحدث اللحظي داخل بعض الشموع غير قابل للتحقق بالكامل.")\n'''
          if s.count(old) != 1: raise SystemExit('presentation insertion point not found exactly once')
          p.write_text(s.replace(old, new))

          test = Path('tests/test_g6_lifecycle_contract.py')
          test.write_text('''from datetime import datetime, timezone\nfrom decimal import Decimal\n\nfrom sqlalchemy import select\n\nfrom capitalguard.application.services.historical_market_replay_service import HistoricalMarketReplayService, MarketCandle\nfrom capitalguard.application.services.historical_signal_materialization_service import HistoricalSignalMaterializationService\nfrom capitalguard.domain.coverage import calculate_historical_coverage, interval_delta\nfrom capitalguard.infrastructure.db.models import HistoricalSignalMaterialization\nfrom capitalguard.interfaces.telegram.presentation_adapter import build_single_result_card\nfrom tests.test_historical_signal_materialization_service import accepted_g5_draft\n\nUTC = timezone.utc\n\nclass AnnualNoMinuteProvider:\n    def __init__(self, daily):\n        self.daily = daily\n        self.minute_calls = 0\n    def fetch_daily(self, **kwargs):\n        rows = [c for c in self.daily if kwargs["start"] <= c.open_time < kwargs["end"]]\n        return rows, "daily-test", calculate_historical_coverage(requested_start=kwargs["start"], requested_end=kwargs["end"], candle_times=(c.open_time for c in rows), interval=interval_delta("1d"))\n    def fetch_minute_day(self, **kwargs):\n        self.minute_calls += 1\n        return [], "minute-test", calculate_historical_coverage(requested_start=kwargs["start"], requested_end=kwargs["end"], candle_times=(), interval=interval_delta("1m"))\n\ndef setup_signal(db_session):\n    draft, _ = accepted_g5_draft(db_session)\n    signal = HistoricalSignalMaterializationService().materialize(db_session, draft_id=draft.id)\n    bridge = db_session.execute(select(HistoricalSignalMaterialization).where(HistoricalSignalMaterialization.signal_id == signal.id)).scalar_one()\n    signal.decision_timestamp = datetime(2025, 1, 1, 12, tzinfo=UTC)\n    signal.entry = Decimal("100")\n    signal.stop_loss = Decimal("90")\n    signal.targets = [{"price": "110", "close_percent": 100}]\n    return signal, bridge\n\ndef candle(day, high=99, low=98):\n    return MarketCandle(asset="BTCUSDT", market="Futures", open_time=day, open=Decimal("99"), high=Decimal(str(high)), low=Decimal(str(low)), close=Decimal("99"), volume=Decimal("1"), data_source="BINANCE_FUTURES")\n\ndef test_annual_untriggered_order_is_completed_not_active(db_session):\n    signal, bridge = setup_signal(db_session)\n    provider = AnnualNoMinuteProvider([candle(datetime(2025, 1, 2, tzinfo=UTC))])\n    result = HistoricalMarketReplayService().replay_g6(db_session, signal_id=signal.id, materialization_id=bridge.id, start=signal.decision_timestamp, replay_end=datetime(2025, 1, 4, tzinfo=UTC), provider=provider)\n    assert result["status"] == "COMPLETED"\n    assert result["run"].result_json["lifecycle_status"] == "NOT_ACTIVATED"\n    assert result["run"].termination_reason == "HORIZON_REACHED_UNTRIGGERED"\n\ndef test_annual_missing_minutes_never_silently_drops_critical_entry_day(db_session):\n    signal, bridge = setup_signal(db_session)\n    provider = AnnualNoMinuteProvider([candle(datetime(2025, 1, 2, tzinfo=UTC), high=101, low=98)])\n    result = HistoricalMarketReplayService().replay_g6(db_session, signal_id=signal.id, materialization_id=bridge.id, start=signal.decision_timestamp, replay_end=datetime(2025, 1, 4, tzinfo=UTC), provider=provider)\n    assert provider.minute_calls >= 1\n    assert result["status"] in {"COMPLETED", "COMPLETED_UNVERIFIABLE"}\n    assert result["run"].result_json["lifecycle_status"] in {"ACTIVE", "CLOSED_UNVERIFIABLE"}\n    assert result["events"]\n\ndef test_presentation_renders_financial_timeline_and_pending_state():\n    view = build_single_result_card(\n        {"asset": "BTCUSDT", "side": "LONG", "entry": "98000", "stop_loss": "97000", "targets": [{"price": "99000"}]},\n        temporal_route="HISTORICAL_CANDIDATE",\n        replay_result={\n            "replay_status": "COMPLETED",\n            "event_count": 0,\n            "lifecycle_status": "NOT_ACTIVATED",\n            "events": [],\n        },\n    )\n    assert "أمر معلق" in view.text\n    assert "0.00%" in view.text\n''')\n          PY
          python -m compileall -q src tests/test_g6_lifecycle_contract.py
          git diff --check
          git add src/capitalguard/interfaces/telegram/presentation_adapter.py tests/test_g6_lifecycle_contract.py
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(g6): cover lifecycle semantics and financial timeline'
          git push
