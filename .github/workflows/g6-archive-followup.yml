name: g6-archive-followup
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'feature/g6-coarse-fine-ambiguity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Add Binance Vision archive fallback and coarse traversal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/capitalguard/infrastructure/market/binance_client.py')
          s=p.read_text()
          if 'import io\n' not in s:
              s=s.replace('import hashlib\n','import hashlib\nimport io\nimport zipfile\n',1)
          helper='''\n    def _fetch_vision_agg_trades(self, *, symbol: str, start: datetime, market: str) -> list[dict]:\n        """Read Binance Public Data daily aggTrades when REST history is unavailable."""\n        normalized_market = market.upper()\n        market_path = "um" if normalized_market == "FUTURES" else "spot"\n        day = start.astimezone(timezone.utc).date().isoformat()\n        url = f"https://data.binance.vision/data/futures/{market_path}/daily/aggTrades/{symbol}/{symbol}-aggTrades-{day}.zip" if normalized_market == "FUTURES" else f"https://data.binance.vision/data/spot/daily/aggTrades/{symbol}/{symbol}-aggTrades-{day}.zip"\n        try:\n            response = requests.get(url, timeout=30)\n            if response.status_code != 200:\n                return []\n            with zipfile.ZipFile(io.BytesIO(response.content)) as archive:\n                members = [name for name in archive.namelist() if name.lower().endswith(('.csv','.csv.gz'))]\n                if not members:\n                    return []\n                import csv, gzip\n                raw = archive.open(members[0])\n                stream = gzip.open(raw, mode='rt', newline='') if members[0].lower().endswith('.gz') else io.TextIOWrapper(raw)\n                try:\n                    reader = csv.reader(stream)\n                    rows=[]\n                    for row in reader:\n                        if len(row) < 6 or not row[0] or row[0].lower().startswith('agg'): continue\n                        try: rows.append({"timestamp": datetime.fromtimestamp(int(row[5]) / 1000, tz=timezone.utc), "price": self._positive_decimal(row[1]), "trade_id": int(row[0])})\n                        except (ValueError, TypeError, OverflowError): continue\n                    return rows\n                finally:\n                    stream.close()\n        except (requests.RequestException, zipfile.BadZipFile, OSError):\n            return []\n'''
          if 'def _fetch_vision_agg_trades(' not in s:
              anchor='\n    def fetch_agg_trades('
              assert anchor in s; s=s.replace(anchor,helper+anchor,1)
          old='''        return sorted(trades, key=lambda x: (x["timestamp"], x.get("trade_id") or 0))\n'''
          new='''        if not trades:\n            # REST aggTrades is a recent-data endpoint; use the official public archive for old replay windows.\n            trades = [t for t in self._fetch_vision_agg_trades(symbol=normalized_symbol, start=start_utc, market=normalized_market) if start_utc <= t["timestamp"] <= end_utc]\n        return sorted(trades, key=lambda x: (x["timestamp"], x.get("trade_id") or 0))\n'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/capitalguard/application/services/historical_market_replay_service.py')
          s=p.read_text()
          method='''\n    @staticmethod\n    def _coarse_to_fine_candles(candles: list[MarketCandle], *, side: str | None, entry: Decimal | None, stop: Decimal | None, target_levels: list[Decimal]) -> list[MarketCandle]:\n        """Hierarchical traversal over already-fetched OHLCV; never issues a second candle provider call."""\n        if not candles: return []\n        groups = {}\n        for candle in candles:\n            key = (candle.open_time.astimezone(timezone.utc).date(), candle.open_time.astimezone(timezone.utc).hour)\n            groups.setdefault(key, []).append(candle)\n        selected=[]\n        activated=False\n        for key in sorted(groups):\n            cluster=groups[key]\n            high=max(c.high for c in cluster); low=min(c.low for c in cluster)\n            levels=[]\n            if not activated and entry is not None: levels.append(entry)\n            if activated:\n                if stop is not None: levels.append(stop)\n                levels.extend(level for i,level in enumerate(target_levels) if i < len(target_levels))\n            touches=any((high >= level if str(side or '').upper() == 'LONG' else low <= level) for level in levels)\n            if touches:\n                selected.extend(cluster)\n                if not activated and entry is not None and (high >= entry if str(side or '').upper() == 'LONG' else low <= entry): activated=True\n        return selected\n'''
          if 'def _coarse_to_fine_candles(' not in s:
              anchor='\n    def replay_candles(\n'; assert anchor in s; s=s.replace(anchor,method+anchor,1)
          old='        eligible_candles = [candle for candle in normalized if self._utc(candle.open_time) >= decision_time]\n'
          new='        eligible_candles = self._coarse_to_fine_candles([candle for candle in normalized if self._utc(candle.open_time) >= decision_time], side=signal.side, entry=entry, stop=stop, target_levels=target_levels)\n'
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          import py_compile
          for f in [Path('src/capitalguard/infrastructure/market/binance_client.py'),Path('src/capitalguard/application/services/historical_market_replay_service.py')]: py_compile.compile(str(f),doraise=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capitalguard/infrastructure/market/binance_client.py src/capitalguard/application/services/historical_market_replay_service.py
          git rm -f .github/workflows/g6-archive-followup.yml
          git commit -m "[g6-upgrade] add historical archive fallback and coarse traversal"
          git push