name: G6 Final Historical Verification
on:
  push:
    branches: [fix/g6-lifecycle-and-historical-result-presentation]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g6-lifecycle-and-historical-result-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full historical test group
        run: pytest -q tests/test_historical_*
      - name: Compile and diff check
        run: python -m compileall -q src ai_service && git diff --check
      - name: Remove verification gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/g6-final-historical-verification.yml
          git commit -m 'chore(g6): remove final historical verification gate'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
