name: G6 Cleanup Runner
on:
  push:
    branches: [fix/g6-lifecycle-and-historical-result-presentation]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g6-lifecycle-and-historical-result-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Finalize lifecycle contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/capitalguard/application/services/historical_forwarding_service.py')
          s=p.read_text()
          a=s.index('    @staticmethod\n    def _lifecycle_status')
          b=s.find('\n    def ', a+10)
          if b < 0: b=len(s)
          block=s[a:b]
          block=block.replace('return "CLOSED_SL"','return "CLOSED_STOP"').replace('return "CLOSED_SOURCE"','return "CLOSED_UNVERIFIABLE"')
          s=s[:a]+block+s[b:]
          p.write_text(s)
          p=Path('tests/test_g6_lifecycle_contract.py')
          s=p.read_text()
          s += '''\n\ndef test_active_daily_stop_plus_target_is_unverifiable(db_session):\n    signal, bridge = _setup(db_session); signal.decision_timestamp=datetime(2025,1,1,12,tzinfo=UTC); signal.entry=Decimal("100"); signal.stop_loss=Decimal("90"); signal.targets=[{"price":"110","close_percent":100}]\n    days=[candle(datetime(2025,1,1,tzinfo=UTC)),candle(datetime(2025,1,2,tzinfo=UTC),111,89)]\n    minutes={datetime(2025,1,1,tzinfo=UTC): minute_series(datetime(2025,1,1,12,tzinfo=UTC), datetime(2025,1,2,tzinfo=UTC), 101,99)}\n    result=HistoricalMarketReplayService().replay_g6(db_session,signal_id=signal.id,materialization_id=bridge.id,start=signal.decision_timestamp,replay_end=datetime(2025,1,3,tzinfo=UTC),provider=Provider(days,minutes))\n    assert result["status"]=="COMPLETED_UNVERIFIABLE"; assert result["run"].result_json["lifecycle_status"]=="CLOSED_UNVERIFIABLE"\n'''
          p.write_text(s)
          PY
      - name: Verify source and tests
        run: pytest -q tests/test_historical_* tests/test_adaptive_historical_replay.py tests/test_g6_lifecycle_contract.py && python -m compileall -q src && git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/capitalguard/application/services/historical_forwarding_service.py tests/test_g6_lifecycle_contract.py
          git commit -m 'fix(g6): align forwarding lifecycle contract and ambiguity regression'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/g6-cleanup-runner.yml .github/workflows/g6-repair-runner.yml .github/workflows/g6-repair-runner-v2.yml
          git add .github/workflows/ci.yml
          git commit -m 'chore(g6): restore CI and remove repair runners'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
