name: G6 Final Fix

on:
  push:
    branches:
      - feature/g6-historical-replay-upgrade

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[g6-final-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align client retry path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/client/src/components/ForwardResultsInspector.tsx')
          text = p.read_text(encoding='utf-8')
          old = 'trpc.capitalguard.admin.retryHistoricalReplay.useMutation'
          new = 'trpc.capitalguard.retryHistoricalReplay.useMutation'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one admin retry reference, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/components/ForwardResultsInspector.tsx
          git commit -m 'fix: align historical retry client route [g6-final-fix-applied]'
          git push origin HEAD:feature/g6-historical-replay-upgrade
