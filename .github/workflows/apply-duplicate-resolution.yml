name: Apply duplicate-resolution patch

on:
  push:
    branches:
      - fix/duplicate-resolution-from-main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/duplicate-resolution-from-main
          fetch-depth: 0

      - name: Apply prepared patch and commit
        run: |
          set -euo pipefail
          test -f .github/duplicate-resolution-apply.patch
          git apply --check .github/duplicate-resolution-apply.patch
          git apply .github/duplicate-resolution-apply.patch
          rm .github/duplicate-resolution-apply.patch .github/workflows/apply-duplicate-resolution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve duplicate historical source messages"
          git push origin HEAD:fix/duplicate-resolution-from-main
