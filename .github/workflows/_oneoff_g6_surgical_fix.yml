name: oneoff-g6-surgical-fix

on:
  push:
    branches:
      - fix/g6-day0-self-heal-direct-20260907
    paths:
      - .github/workflows/_oneoff_g6_surgical_fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical replay repairs
        shell: python
        run: |
          from pathlib import Path

          replay_path = Path("src/capitalguard/application/services/historical_market_replay_service.py")
          forwarding_path = Path("src/capitalguard/application/services/historical_forwarding_service.py")

          replay = replay_path.read_text(encoding="utf-8")
          forwarding = forwarding_path.read_text(encoding="utf-8")

          # --- G6: true causal Day-0 ---
          old = '''        planner = AdaptiveHistoricalReplayPlanner()\n        macro_start = planner.day_start(self._utc(signal.decision_timestamp))\n        run, created = self._get_or_create_run(\n            session, signal_id=signal_id, materialization_id=materialization_id,\n            start=macro_start, replay_end=end_utc, interval="1m", limit=limit,\n            retry_of_fingerprint=retry_of_fingerprint,\n        )'''
          new = '''        planner = AdaptiveHistoricalReplayPlanner()\n        source_time = self._utc(signal.decision_timestamp)\n        day_zero = planner.day_start(source_time)\n        macro_start = day_zero + timedelta(days=1)\n        run, created = self._get_or_create_run(\n            session, signal_id=signal_id, materialization_id=materialization_id,\n            start=source_time, replay_end=end_utc, interval="1m", limit=limit,\n            retry_of_fingerprint=retry_of_fingerprint,\n        )'''
          assert old in replay, "G6 header block not found"
          replay = replay.replace(old, new, 1)

          old = '''        def range_touches(candle, level: Decimal, *, is_stop: bool = False) -> bool:\n            side = str(signal.side or "").upper()\n            if side == "LONG":\n                return candle.low <= level if is_stop else candle.high >= level\n            return candle.high >= level if is_stop else candle.low <= level\n\n        for annual in planner.annual_windows(macro_start, end_utc):'''
          new = '''        def range_touches(candle, level: Decimal, *, is_stop: bool = False) -> bool:\n            side = str(signal.side or "").upper()\n            if side == "LONG":\n                return candle.low <= level if is_stop else candle.high >= level\n            return candle.high >= level if is_stop else candle.low <= level\n\n        def apply_day_events(current_state: LifecycleState, day_events: list[HistoricalSignalEvent]) -> LifecycleState:\n            hit = set(current_state.hit_target_indices)\n            activated = current_state.activated\n            lifecycle = current_state.lifecycle_state\n            last_ts = current_state.last_processed_timestamp\n            for event in day_events:\n                event_type = str(event.event_type)\n                last_ts = event.event_timestamp\n                if event_type == "ACTIVATED":\n                    activated = True; lifecycle = "ACTIVE"\n                elif event_type.startswith("TP") and event_type[2:].isdigit():\n                    hit.add(int(event_type[2:])); lifecycle = "CLOSED_TARGETS" if len(hit) == len(target_levels) else "ACTIVE"\n                elif event_type == "SL":\n                    lifecycle = "CLOSED_STOP"\n                elif event_type == "CLOSE":\n                    lifecycle = "FINAL_CLOSE"\n                elif event_type == "AMBIGUOUS":\n                    lifecycle = "CLOSED_UNVERIFIABLE"\n            return LifecycleState(\n                activated=activated, hit_target_indices=frozenset(hit),\n                remaining_target_indices=frozenset(set(range(1, len(target_levels) + 1)) - hit),\n                current_stop=current_state.current_stop, lifecycle_state=lifecycle,\n                last_processed_timestamp=last_ts,\n            )\n\n        # Day-0 is causal: start exactly at the signal source timestamp and\n        # resolve chronology with 1m candles. No daily candle is used to decide\n        # whether the signal existed before its own source time.\n        day_zero_window = planner.minute_window_for_day(\n            day=day_zero, signal_source_time=source_time, now=end_utc\n        )\n        if day_zero_window is not None:\n            minute_fetch = getattr(provider, "fetch_minute_day", None)\n            if minute_fetch is None:\n                raise HistoricalSignalValidationError("Adaptive G6 provider lacks critical-day minute adapter")\n            minutes, minute_endpoint, minute_coverage = minute_fetch(\n                asset=str(signal.asset or ""), market=signal.market,\n                start=day_zero_window.start, end=day_zero_window.end,\n            )\n            macro_statuses.append(minute_coverage.status.value)\n            if minutes:\n                drilldown_days.append(day_zero.isoformat())\n                day_events = self.replay_candles(\n                    session, signal_id=signal_id, candles=minutes, replay_end=day_zero_window.end,\n                    interval="1m", provider_endpoint=minute_endpoint, replay_run_id=run.id,\n                    fetched_at=fetched_at, data_as_of_status="UNVERIFIABLE", refresh_ranking=False,\n                    resolver_client=getattr(provider, "client", None), initial_state=state,\n                )\n                all_events.extend(day_events)\n                state = apply_day_events(state, day_events)\n\n        if not planner.terminal(state):\n            for annual in planner.annual_windows(macro_start, end_utc):'''
          assert old in replay, "G6 annual-loop marker not found"
          replay = replay.replace(old, new, 1)

          old = '''            for day_candle in sorted(daily, key=lambda item: self._utc(item.open_time)):\n                day = planner.day_start(day_candle.open_time)\n                if day < macro_start or day >= end_utc:\n                    continue\n                is_day_zero = day == macro_start\n                if is_day_zero:\n                    critical = True\n                elif state.activated:'''
          new = '''                for day_candle in sorted(daily, key=lambda item: self._utc(item.open_time)):\n                    day = planner.day_start(day_candle.open_time)\n                    if day < macro_start or day >= end_utc:\n                        continue\n                    if state.activated:'''
          assert old in replay, "G6 day-zero daily branch not found"
          replay = replay.replace(old, new, 1)

          old = '''                else:\n                    critical = entry is not None and range_touches(day_candle, entry)\n                if not critical:\n                    continue\n\n                window = planner.minute_window_for_day(\n                    day=day, signal_source_time=self._utc(signal.decision_timestamp), now=end_utc\n                )'''
          new = '''                    else:\n                        critical = entry is not None and range_touches(day_candle, entry)\n                    if not critical:\n                        continue\n\n                    window = planner.minute_window_for_day(\n                        day=day, signal_source_time=source_time, now=end_utc\n                    )'''
          assert old in replay, "G6 daily indentation/critical block not found"
          replay = replay.replace(old, new, 1)

          old = '''                all_events.extend(day_events)\n                hit = set(state.hit_target_indices)\n                activated = state.activated\n                lifecycle = state.lifecycle_state\n                last_ts = state.last_processed_timestamp\n                for event in day_events:\n                    event_type = str(event.event_type)\n                    last_ts = event.event_timestamp\n                    if event_type == "ACTIVATED":\n                        activated = True; lifecycle = "ACTIVE"\n                    elif event_type.startswith("TP") and event_type[2:].isdigit():\n                        hit.add(int(event_type[2:])); lifecycle = "CLOSED_TARGETS" if len(hit) == len(target_levels) else "ACTIVE"\n                    elif event_type == "SL":\n                        lifecycle = "CLOSED_STOP"\n                    elif event_type == "CLOSE":\n                        lifecycle = "FINAL_CLOSE"\n                    elif event_type == "AMBIGUOUS":\n                        lifecycle = "CLOSED_UNVERIFIABLE"\n                state = LifecycleState(\n                    activated=activated, hit_target_indices=frozenset(hit),\n                    remaining_target_indices=frozenset(set(range(1, len(target_levels) + 1)) - hit),\n                    current_stop=state.current_stop, lifecycle_state=lifecycle,\n                    last_processed_timestamp=last_ts,\n                )'''
          new = '''                    all_events.extend(day_events)\n                    state = apply_day_events(state, day_events)'''
          assert old in replay, "G6 lifecycle state block not found"
          replay = replay.replace(old, new, 1)

          replay = replay.replace('''            "requested_start": macro_start.isoformat(), "requested_end": end_utc.isoformat(),''', '''            "requested_start": source_time.isoformat(), "requested_end": end_utc.isoformat(),''', 1)
          replay = replay.replace('''        coverage = self._coverage_from_candles(start=macro_start, end=end_utc, interval="1d", candles=[''', '''        coverage = self._coverage_from_candles(start=macro_start, end=end_utc, interval="1d", candles=[''', 1)

          # --- Forwarding: failed/partial canonical replays self-heal ---
          old = '''                HistoricalReplayRun.status.in_({"COMPLETED", "COMPLETED_UNVERIFIABLE"}),\n            )'''
          new = '''            )'''
          assert old in forwarding, "duplicate replay status filter not found"
          forwarding = forwarding.replace(old, new, 1)

          old = '''        existing_summary = (batch.metadata_json or {}).get("auto_progression")\n        staged_exists = session.scalar(\n            select(HistoricalForwardReceipt.id).where(\n                HistoricalForwardReceipt.batch_id == batch_id,\n                HistoricalForwardReceipt.validation_status == "STAGED",\n            ).limit(1)\n        ) is not None\n        if not staged_exists and existing_summary:'''
          new = '''        existing_summary = (batch.metadata_json or {}).get("auto_progression")\n        receipts = session.execute(\n            select(HistoricalForwardReceipt)\n            .where(HistoricalForwardReceipt.batch_id == batch_id)\n            .order_by(HistoricalForwardReceipt.id)\n        ).scalars().all()\n        staged_exists = any(receipt.validation_status == "STAGED" for receipt in receipts)\n        duplicate_exists = any(receipt.validation_status == "DUPLICATE" for receipt in receipts)\n        if not staged_exists and not duplicate_exists and existing_summary:'''
          assert old in forwarding, "auto-progress early-return block not found"
          forwarding = forwarding.replace(old, new, 1)

          old = '''        receipts = session.execute(\n            select(HistoricalForwardReceipt)\n            .where(HistoricalForwardReceipt.batch_id == batch_id)\n            .order_by(HistoricalForwardReceipt.id)\n        ).scalars().all()\n        items: list[dict[str, Any]] = []'''
          new = '''        items: list[dict[str, Any]] = []'''
          assert old in forwarding, "duplicate receipts query not found"
          forwarding = forwarding.replace(old, new, 1)

          old = '''            if receipt.validation_status == "DUPLICATE":\n                duplicate_count += 1\n                resolution = (receipt.metadata_json or {}).get("duplicate_resolution") or {}\n                replay = resolution.get("replay") or {}'''
          new = '''            if receipt.validation_status == "DUPLICATE":\n                duplicate_count += 1\n                resolution = (receipt.metadata_json or {}).get("duplicate_resolution") or {}\n                refreshed = None\n                if receipt.source_chat_id is not None and receipt.source_message_id is not None:\n                    refreshed = self._duplicate_resolution(\n                        session,\n                        source_chat_id=int(receipt.source_chat_id),\n                        source_message_id=int(receipt.source_message_id),\n                    )\n                if refreshed is not None:\n                    resolution = refreshed\n                    receipt.metadata_json = {\n                        **(receipt.metadata_json or {}),\n                        "duplicate_resolution": resolution,\n                    }\n                    session.flush()\n                replay = resolution.get("replay") or {}\n                replay_status = str(replay.get("replay_status") or "")\n                previous_receipt_id = resolution.get("previous_receipt_id")\n                if replay_status in {"FAILED", "REPLAY_PARTIAL"} and previous_receipt_id:\n                    try:\n                        healed = self.replay_service.retry_g6(\n                            session, receipt_id=int(previous_receipt_id), provider=provider\n                        )\n                        healed_run = healed.get("run")\n                        if healed_run is not None:\n                            healed_result = dict(healed_run.result_json or {})\n                            healed_events = healed_result.get("events") or []\n                            replay = {\n                                **replay,\n                                "replay_status": str(healed_run.status),\n                                "event_count": healed_result.get("event_count", len(healed_events)),\n                                "last_event": healed_events[-1].get("type") if healed_events else None,\n                                "lifecycle_status": healed_result.get("lifecycle_status"),\n                                "resolution_quality": healed_result.get("resolution_quality"),\n                                "termination_reason": healed_result.get("termination_reason"),\n                                "exit_timestamp": healed_result.get("exit_timestamp"),\n                                "coverage_status": healed_run.coverage_status,\n                                "run_id": healed_run.id,\n                                "run_ref": healed_run.run_ref,\n                            }\n                            resolution["replay"] = replay\n                            receipt.metadata_json = {\n                                **(receipt.metadata_json or {}),\n                                "duplicate_resolution": resolution,\n                            }\n                            session.flush()\n                            if str(healed_run.status) in {"COMPLETED", "COMPLETED_UNVERIFIABLE"}:\n                                replay_statuses.append(str(healed_run.status))\n                            else:\n                                failed += 1\n                    except Exception as exc:\n                        failed += 1\n                        replay = {\n                            **replay,\n                            "replay_status": "FAILED",\n                            "retry_error_type": type(exc).__name__,\n                        }\n                        resolution["replay"] = replay\n                        receipt.metadata_json = {\n                            **(receipt.metadata_json or {}),\n                            "duplicate_resolution": resolution,\n                        }\n                        session.flush()'''
          assert old in forwarding, "duplicate branch header not found"
          forwarding = forwarding.replace(old, new, 1)

          replay_path.write_text(replay, encoding="utf-8")
          forwarding_path.write_text(forwarding, encoding="utf-8")

          # Structural checks before any commit.
          compile(open(replay_path, encoding="utf-8').read(), str(replay_path), "exec")
          compile(open(forwarding_path, encoding="utf-8').read(), str(forwarding_path), "exec")
          print("surgical source edits applied")

      - name: Run Python compile checks
        run: python -m compileall -q src/capitalguard

      - name: Run historical replay tests
        run: |
          if [ -d tests ]; then
            pytest -q tests -k 'historical or replay or forwarding' --maxfail=1
          else
            echo 'No tests directory; compile checks completed.'
          fi

      - name: Commit repaired source and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_oneoff_g6_surgical_fix.yml
          git add src/capitalguard/application/services/historical_market_replay_service.py src/capitalguard/application/services/historical_forwarding_service.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(g6): make day-zero causal and self-heal failed duplicates"
          git push origin HEAD
