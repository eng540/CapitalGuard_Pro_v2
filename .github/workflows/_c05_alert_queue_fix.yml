name: C-05 Alert Queue Fix

on:
  push:
    branches:
      - fix/financial-trading-reality-contract-r2

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'C-05 alert queue fix applied')"
    runs-on: ubuntu-latest
    steps:
      - name: Patch alert service and remove temporary runner
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'src/capitalguard/application/services/alert_service.py';
            const branch = 'fix/financial-trading-reality-contract-r2';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const current = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            if (Array.isArray(current.data)) throw new Error('Expected file, got directory');
            const sha = current.data.sha;
            const content = Buffer.from(current.data.content, 'base64').toString('utf8');

            const oldBlock = `        # ── وضع التيك — non-blocking ────────────────────────────────────\n        try:\n            q.put_nowait(payload)\n        except asyncio.QueueFull:\n            # الـ queue ممتلئة → تجاهل أقدم تيك واستبدله بالجديد\n            # التيك القديم بيانات منتهية الصلاحية — الجديد أدق\n            try:\n                q.get_nowait()\n            except asyncio.QueueEmpty:\n                pass\n            try:\n                q.put_nowait(payload)\n            except asyncio.QueueFull:\n                pass  # لا يحدث عملياً\n`;

            const newBlock = `        # ── وضع التيك — lossless financial observation delivery ───────────\n        # لا يجوز إسقاط أو استبدال أي observation مالي عند saturation.\n        # backpressure هنا مقصود: ينتظر الـ worker حتى تتوفر سعة.\n        await q.put(payload)\n`;

            if (!content.includes(oldBlock)) {
              throw new Error('C-05 target block not found; no mutation performed');
            }

            const updated = content.replace(oldBlock, newBlock);
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: 'fix: preserve every financial tick under queue saturation',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha,
            });

            const workflowPath = '.github/workflows/_c05_alert_queue_fix.yml';
            const workflow = await github.rest.repos.getContent({owner, repo, path: workflowPath, ref: branch});
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path: workflowPath,
              branch,
              message: 'chore: remove temporary C-05 patch runner',
              sha: workflow.data.sha,
            });