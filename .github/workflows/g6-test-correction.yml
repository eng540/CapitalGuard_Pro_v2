name: G6 Test Correction

on:
  push:
    branches:
      - fix/g6-runtime-canonical

permissions:
  contents: write

jobs:
  correct-test:
    if: ${{ !contains(github.event.head_commit.message, '[g6-test-correction-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct G6 coverage assertion and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_historical_forwarding_auto_progression.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert item["replay_status"] == "PARTIAL_WINDOW"\n'
          new = '    assert item["coverage_status"] == "PARTIAL_WINDOW"\n    assert item["replay_status"] == "REPLAY_PARTIAL"\n'
          if old not in text:
              raise SystemExit('expected assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/g6-test-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_historical_forwarding_auto_progression.py
          git commit -m 'test(g6): assert coverage status separately [g6-test-correction-applied]'
          git push origin HEAD:fix/g6-runtime-canonical
