name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./dev.db
      API_KEY: test_api_key
      TELEGRAM_BOT_TOKEN: 123:fake_token
      ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply G6 temporal upgrade
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          p = root/'src/capitalguard/infrastructure/market/binance_client.py'
          s = p.read_text()
          marker = 'FUTURES_KLINES = "https://fapi.binance.com/fapi/v1/klines"\n'
          assert marker in s
          if 'FUTURES_AGG_TRADES' not in s:
              s = s.replace(marker, marker + 'SPOT_AGG_TRADES = f"{BASE}/aggTrades"\nFUTURES_AGG_TRADES = "https://fapi.binance.com/fapi/v1/aggTrades"\n', 1)
          method = '''\n    def fetch_agg_trades(self, *, symbol: str, start: datetime, end: datetime, market: str = "SPOT", limit: int = 1000, timeout_seconds: float = 10.0, max_retries: int = 3) -> list[dict]:\n        """Fetch aggregate trades for one disputed candle; replay policy remains outside the client."""\n        normalized_symbol = symbol.strip().upper()\n        if not SYMBOL_PATTERN.fullmatch(normalized_symbol): raise HistoricalMarketProviderError("Aggregate trade symbol is invalid")\n        if start.tzinfo is None or end.tzinfo is None: raise HistoricalMarketProviderError("Aggregate trade bounds must be timezone-aware")\n        start_utc, end_utc = start.astimezone(timezone.utc), end.astimezone(timezone.utc)\n        if start_utc >= end_utc or (end_utc - start_utc).total_seconds() > 60.001: raise HistoricalMarketProviderError("Aggregate trade window must be within one minute")\n        if not 1 <= limit <= 1000: raise HistoricalMarketProviderError("Aggregate trade limit is out of range")\n        normalized_market = market.strip().upper()\n        if normalized_market not in {"SPOT", "FUTURES"}: raise HistoricalMarketProviderError("Aggregate trade market is unsupported")\n        endpoint = FUTURES_AGG_TRADES if normalized_market == "FUTURES" else SPOT_AGG_TRADES\n        params = {"symbol": normalized_symbol, "startTime": int(start_utc.timestamp()*1000), "endTime": int(end_utc.timestamp()*1000), "limit": limit}\n        rows = None\n        for attempt in range(max_retries + 1):\n            try:\n                response = requests.get(endpoint, params=params, timeout=timeout_seconds)\n                if response.status_code in RETRYABLE_STATUS_CODES:\n                    if attempt >= max_retries: response.raise_for_status()\n                    time.sleep(self._retry_delay(attempt, (response.headers or {}).get("Retry-After"))); continue\n                response.raise_for_status(); rows = response.json(); break\n            except requests.RequestException as exc:\n                if attempt >= max_retries: raise HistoricalMarketProviderError("Aggregate trade provider is unavailable") from exc\n                time.sleep(self._retry_delay(attempt))\n            except ValueError as exc: raise HistoricalMarketProviderError("Aggregate trade provider returned invalid JSON") from exc\n        if rows is None: raise HistoricalMarketProviderError("Aggregate trade provider is unavailable")\n        if not isinstance(rows, list) or len(rows) > limit: raise HistoricalMarketProviderError("Aggregate trade provider returned invalid payload")\n        trades = []\n        for row in rows:\n            if not isinstance(row, dict) or "p" not in row or "T" not in row: raise HistoricalMarketProviderError("Aggregate trade payload is malformed")\n            try: timestamp = datetime.fromtimestamp(int(row["T"])/1000, tz=timezone.utc); price = self._positive_decimal(row["p"])\n            except (TypeError, ValueError, OverflowError) as exc: raise HistoricalMarketProviderError("Aggregate trade payload contains invalid values") from exc\n            if start_utc <= timestamp <= end_utc: trades.append({"timestamp": timestamp, "price": price, "trade_id": row.get("a")})\n        return sorted(trades, key=lambda x: (x["timestamp"], x.get("trade_id") or 0))\n'''
          if 'def fetch_agg_trades(' not in s: s = s.replace('\n    def get_historical_ohlcv(\n', method + '\n    def get_historical_ohlcv(\n', 1)
          p.write_text(s)

          r = root/'src/capitalguard/infrastructure/market/intra_candle_resolver.py'
          r.write_text('''from __future__ import annotations\nfrom dataclasses import dataclass\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\nfrom typing import Any\n\n@dataclass(frozen=True)\nclass AmbiguityResolution:\n    event: str\n    resolution: str\n    reason: str\n    confidence: Decimal\n    details: dict[str, Any]\n\nclass IntraCandleResolver:\n    """Single-candle conflict resolver; it owns no replay state."""\n    def __init__(self, client): self.client = client\n    @staticmethod\n    def _hit(side, price, level): return price >= level if side.upper() == "LONG" else price <= level\n    @staticmethod\n    def _stop(side, price, level): return price <= level if side.upper() == "LONG" else price >= level\n    def resolve(self, *, symbol, market, side, candle_open, candle_close, stop, target_levels, candle_high, candle_low):\n        start = candle_open.astimezone(timezone.utc); end = candle_close.astimezone(timezone.utc)\n        try: trades = self.client.fetch_agg_trades(symbol=symbol, start=start, end=end, market=market or "SPOT", limit=1000)\n        except Exception as exc: return self._fallback(side, stop, target_levels, start, candle_high, candle_low, f"AGG_TRADES_UNAVAILABLE:{type(exc).__name__}")\n        for trade in trades:\n            price = Decimal(str(trade["price"])); hits = [i for i, l in target_levels if self._hit(side, price, l)]\n            if self._stop(side, price, stop): return AmbiguityResolution("SL", "VERIFIED_EVENT", "AGG_TRADES", Decimal("1"), {"timestamp": trade["timestamp"].isoformat(), "price": str(price), "target_indices": hits})\n            if hits: return AmbiguityResolution(f"TP{hits[0]}", "VERIFIED_EVENT", "AGG_TRADES", Decimal("1"), {"timestamp": trade["timestamp"].isoformat(), "price": str(price), "target_indices": hits})\n        return self._fallback(side, stop, target_levels, start, candle_high, candle_low, "AGG_TRADES_EMPTY_OR_NO_TRIGGER")\n    @staticmethod\n    def _fallback(side, stop, target_levels, candle_open, high, low, reason):\n        collided = [i for i, l in target_levels if (high >= l if side.upper() == "LONG" else low <= l)]\n        return AmbiguityResolution("SL", "PESSIMISTIC_FALLBACK", reason, Decimal("0.5000"), {"candle_time": candle_open.isoformat(), "high": str(high), "low": str(low), "stop": str(stop), "collided_target_indices": collided, "inferred_event": "SL_FIRST"})\n''')

          p = root/'src/capitalguard/application/services/historical_market_replay_service.py'
          s = p.read_text()
          imp = 'from capitalguard.domain.simulation_clock import SimulationClock\n'
          if 'IntraCandleResolver' not in s: assert imp in s; s = s.replace(imp, imp + 'from capitalguard.infrastructure.market.intra_candle_resolver import IntraCandleResolver\n', 1)
          init = '        self.candle_cache = candle_cache or CandleCache()\n'
          if 'self.intra_candle_resolver' not in s: assert init in s; s = s.replace(init, init + '        self.intra_candle_resolver = None\n', 1)
          old = '''        targets = signal.targets if isinstance(signal.targets, list) else []\n        target_levels = [self._decimal(target.get("price")) for target in targets if isinstance(target, dict)]\n        return signal, entry, stop, [level for level in target_levels if level is not None]\n'''
          new = '''        targets = signal.targets if isinstance(signal.targets, list) else []\n        target_levels = []\n        seen_prices = set()\n        for target in targets:\n            if not isinstance(target, dict): continue\n            level = self._decimal(target.get("price"))\n            if level is None or level in seen_prices: continue\n            seen_prices.add(level); target_levels.append(level)\n        return signal, entry, stop, target_levels\n'''
          if old in s: s = s.replace(old, new, 1)
          oldblock = '''            if stop_hit and target_hits and replay_run_id is not None:\n                ambiguity_status = "AMBIGUOUS"\n                events.append(self.signal_service.record_event(session, signal_id=signal.id, event_type="AMBIGUOUS", event_timestamp=candle_time, market_as_of=candle_time, data_source=candle.data_source, price=None, replay_status="AMBIGUOUS", event_confidence="0.0000", event_data={"replay_end": end_time.isoformat(), "candle_rule": "PESSIMISTIC_SL_FIRST_INFERRED", "possible_events": ["SL", *[f"TP{index}" for index in target_hits]], "high": str(candle.high), "low": str(candle.low), "market_evidence_ref": market_evidence.replay_run_ref if market_evidence else None, "replay_run_id": replay_run_id}, dedup_key=f"{dedup_prefix}:AMBIGUOUS:{candle_time.isoformat()}", replay_run_id=replay_run_id, refresh_ranking=refresh_ranking))\n                closed = True\n                continue\n'''
          newblock = '''            if stop_hit and target_hits and replay_run_id is not None:\n                if self.intra_candle_resolver is None:\n                    from capitalguard.infrastructure.market.binance_client import BinanceClient\n                    self.intra_candle_resolver = IntraCandleResolver(BinanceClient())\n                resolution = self.intra_candle_resolver.resolve(symbol=str(signal.asset or ""), market=signal.market, side=str(signal.side or ""), candle_open=candle_time, candle_close=candle_time + interval_delta(interval), stop=stop, target_levels=list(enumerate(target_levels, start=1)), candle_high=candle.high, candle_low=candle.low)\n                event_type = resolution.event\n                event_price = stop if event_type == "SL" else target_levels[int(event_type[2:]) - 1]\n                replay_status = "VERIFIED" if resolution.resolution == "VERIFIED_EVENT" else "INFERRED"\n                ambiguity_status = "NONE" if resolution.resolution == "VERIFIED_EVENT" else "INFERRED"\n                events.append(self.signal_service.record_event(session, signal_id=signal.id, event_type=event_type, event_timestamp=candle_time, market_as_of=candle_time, data_source=candle.data_source, price=event_price, replay_status=replay_status, event_confidence=str(resolution.confidence), event_data={"replay_end": end_time.isoformat(), "candle_rule": resolution.resolution, "resolution": resolution.resolution, "reason": resolution.reason, "resolution_details": resolution.details, "market_evidence_ref": market_evidence.replay_run_ref if market_evidence else None, "replay_run_id": replay_run_id}, dedup_key=f"{dedup_prefix}:{event_type}:{candle_time.isoformat()}", replay_run_id=replay_run_id, refresh_ranking=refresh_ranking))\n                closed = True\n                continue\n'''
          if oldblock in s: s = s.replace(oldblock, newblock, 1)
          if '"events": [{"id": event.id' not in s:
              needle = '            "event_count": len(events),\n'; assert needle in s
              s = s.replace(needle, needle + '            "events": [{"id": event.id, "type": event.event_type, "timestamp": event.event_timestamp.isoformat(), "price": str(event.price) if event.price is not None else None, "replay_status": event.replay_status, "confidence": str(event.event_confidence), "data": event.event_data} for event in events],\n', 1)
          s = s.replace('run.ambiguity_status == "AMBIGUOUS" or run.data_as_of_status != "VERIFIED"', 'run.ambiguity_status in {"AMBIGUOUS", "INFERRED"} or run.data_as_of_status != "VERIFIED"')
          p.write_text(s)
          import py_compile
          for f in [p, r, root/'src/capitalguard/infrastructure/market/binance_client.py']: py_compile.compile(str(f), doraise=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capitalguard/infrastructure/market/binance_client.py src/capitalguard/infrastructure/market/intra_candle_resolver.py src/capitalguard/application/services/historical_market_replay_service.py
          git rm -f .github/workflows/apply-g6-upgrade.yml || true
          if ! git diff --cached --quiet; then git commit -m "[g6-upgrade] implement temporal ambiguity resolution" && git push; fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pip-audit

      - name: Lint critical Python errors
        run: flake8 src ai_service --select=E9,F63,F7,F82

      - name: Security (Bandit high severity)
        run: bandit -r src ai_service -q --severity-level high

      - name: Dependencies Audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Compile
        run: python -m compileall -q src ai_service

      - name: Alembic heads
        run: PYTHONPATH=src alembic heads

      - name: Verify single Alembic head
        run: PYTHONPATH=src python scripts/verify_alembic_single_head.py

      - name: Tests
        run: pytest -q

  fresh-postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capitalguard
          POSTGRES_PASSWORD: capitalguard
          POSTGRES_DB: capitalguard_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalguard -d capitalguard_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://capitalguard:capitalguard@localhost:5432/capitalguard_fresh
      API_KEY: test_api_key
      TELEGRAM_BOT_TOKEN: 123:fake_token
      ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply Alembic to an empty PostgreSQL database
        run: PYTHONPATH=src alembic upgrade head
      - name: Verify fresh schema and empty domain tables
        run: PYTHONPATH=src python scripts/verify_fresh_postgres_migration.py
      - name: Exercise reconciliation verifier against isolated CI database
        env:
          RECONCILIATION_EXPECTED_DB: capitalguard_fresh
        run: PYTHONPATH=src python scripts/reconcile_existing_data.py
      - name: Verify G5 materialization PostgreSQL concurrency
        run: PYTHONPATH=src:. python scripts/verify_g5_postgres_concurrency.py

  web-contract-coverage:
    runs-on: ubuntu-latest
    env:
      CAPITALGUARD_CORE_BASE_URL: https://core.test.invalid
      CAPITALGUARD_CORE_API_KEY: ci_test_core_service_key
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked Web dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript contract check
        run: pnpm check
      - name: Vitest contract coverage
        run: pnpm test
      - name: Production build check
        run: pnpm build
