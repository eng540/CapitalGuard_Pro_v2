name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./dev.db
      API_KEY: test_api_key
      TELEGRAM_BOT_TOKEN: 123:fake_token
      ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply duplicate-resolution source-layer patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/duplicate-resolution-from-main'
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          for patch in $(find .github -maxdepth 1 -type f -name 'dup-0[2-9].patch' -o -name 'dup-10.patch' -o -name 'dup-11.patch' | sort); do
            git apply --3way "$patch"
          done
          python -c 'from pathlib import Path; p=Path("src/capitalguard/interfaces/telegram/presentation_adapter.py"); s=p.read_text(); s=s.replace("        \"DUPLICATE\": \"مكررة\",", "        \"DUPLICATE\": \"♻️ التوصية مسجلة مسبقاً\",\\n        \"ALREADY_REGISTERED\": \"♻️ التوصية مسجلة مسبقاً\","); old="    replay_status = str(replay.get(\"replay_status\") or \"\").upper()\\n    if replay_status in {\"COMPLETED\", \"COMPLETED_UNVERIFIABLE\"}:"; new="    replay_status = str(replay.get(\"replay_status\") or \"\").upper()\\n    already_registered = bool(replay.get(\"duplicate\")) or str(replay.get(\"status\") or \"\").upper() == \"ALREADY_REGISTERED\"\\n    if already_registered:\\n        lines.append(\"♻️ <b>التوصية مسجلة مسبقاً</b>\")\\n        lines.append(\"لم تتم إعادة المحاكاة؛ تم استرجاع نتيجة الرسالة المسجلة سابقاً.\")\\n        if replay_status in {\"COMPLETED\", \"COMPLETED_UNVERIFIABLE\"}:\\n            if replay_status == \"COMPLETED_UNVERIFIABLE\":\\n                lines.append(\"المحاكاة التاريخية السابقة: اكتملت وتم حسم الإغلاق المالي، مع تعذر التحقق الكامل من ترتيب الصفقات اللحظية داخل بعض الشموع.\")\\n            else:\\n                lines.append(\"المحاكاة التاريخية السابقة: اكتملت وفق بيانات السوق المتاحة.\")\\n            for label, key in ((\"الحالة\", \"replay_status\"), (\"عدد الأحداث\", \"event_count\"), (\"آخر حدث\", \"last_event\"), (\"دورة الحياة\", \"lifecycle_status\")):\\n                value = replay.get(key)\\n                if value is not None:\\n                    lines.append(f\"{label}: <code>{_text(value)}</code>\")\\n            if replay_status == \"COMPLETED_UNVERIFIABLE\":\\n                lines.append(\"⚠️ اكتملت المحاكاة وتم حسم الإغلاق المالي، مع تعذر التحقق الكامل من ترتيب الصفقات اللحظية داخل بعض الشموع.\")\\n        else:\\n            lines.append(\"لا توجد نتيجة Replay نهائية محفوظة لهذه الرسالة حتى الآن.\")\\n    elif replay_status in {\"COMPLETED\", \"COMPLETED_UNVERIFIABLE\"}:"; s=s.replace(old,new); old2="        if replay_pending is not None:\\n            lines.append(f\"تنتظر نتيجة: {_text(replay_pending)}\")\\n        if replay_status == \"COMPLETED_UNVERIFIABLE\":"; new2="        if replay_pending is not None:\\n            lines.append(f\"تنتظر نتيجة: {_text(replay_pending)}\")\\n        if replay_status == \"ALREADY_REGISTERED\":\\n            lines.append(\"♻️ التوصية مسجلة مسبقاً؛ تم استرجاع النتائج السابقة دون إعادة المحاكاة.\")\\n        elif replay_status == \"COMPLETED_UNVERIFIABLE\":"; s=s.replace(old2,new2); p.write_text(s)'
          python -c 'from pathlib import Path; import re; p=Path("src/capitalguard/interfaces/telegram/presentation_adapter.py"); s=p.read_text(); p.write_text(re.sub(r"\\\\n(?=[ \\t]+)", "\\n", s))'
          python -c 'from pathlib import Path; p=Path("tests/test_historical_forwarding_auto_progression.py"); s=p.read_text(); s=s.replace("from capitalguard.application.services.historical_forwarding_service import HistoricalForwardingService", "from capitalguard.application.services.historical_forwarding_service import ForwardedMessageInput, HistoricalForwardingService"); p.write_text(s)'
          tail -n +6 .github/dup-16.patch | grep '^+' | grep -v '^+++' | sed 's/^+//' >> tests/test_historical_forwarding_auto_progression.py
          rm -f .github/dup-*.patch .github/duplicate-resolution-apply.patch .github/workflows/apply-duplicate-resolution.yml
          git restore --source=origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve duplicate historical source messages"
          git push origin HEAD:"$GITHUB_HEAD_REF"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pip-audit
      - name: Lint critical Python errors
        run: flake8 src ai_service --select=E9,F63,F7,F82
      - name: Security (Bandit high severity)
        run: bandit -r src ai_service -q --severity-level high
      - name: Dependencies audit
        run: pip-audit -r requirements.txt
      - name: Compile
        run: python -m compileall -q src ai_service
      - name: Alembic heads
        run: PYTHONPATH=src alembic heads
      - name: Verify single Alembic head
        run: PYTHONPATH=src python scripts/verify_alembic_single_head.py
      - name: G6 and Core tests
        run: pytest -q
  fresh-postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capitalguard
          POSTGRES_PASSWORD: capitalguard
          POSTGRES_DB: capitalguard_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalguard -d capitalguard_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://capitalguard:capitalguard@localhost:5432/capitalguard_fresh
      API_KEY: test_api_key
      TELEGRAM_BOT_TOKEN: 123:fake_token
      ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply Alembic to empty PostgreSQL database
        run: PYTHONPATH=src alembic upgrade head
      - name: Verify fresh schema
        run: PYTHONPATH=src python scripts/verify_fresh_postgres_migration.py
      - name: Verify reconciliation
        env:
          RECONCILIATION_EXPECTED_DB: capitalguard_fresh
        run: PYTHONPATH=src python scripts/reconcile_existing_data.py
      - name: Verify G5 PostgreSQL concurrency
        run: PYTHONPATH=src:. python scripts/verify_g5_postgres_concurrency.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Frontend tests
        run: pnpm test
      - name: Production build
        run: pnpm build
