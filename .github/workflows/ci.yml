name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./dev.db
      API_KEY: test_api_key
      TELEGRAM_BOT_TOKEN: 123:fake_token
      ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply prepared duplicate-resolution patch chunks
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/duplicate-resolution-from-main'
        run: |
          set -euo pipefail
          if compgen -G '.github/dup-*.patch' > /dev/null; then
            git fetch origin main
            git fetch origin "$GITHUB_HEAD_REF"
            git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
            python - <<'PY'
            from pathlib import Path
            import re

            for path in sorted(Path('.github').glob('dup-*.patch')):
                text = path.read_text()
                lines = text.splitlines()
                out = []
                i = 0
                while i < len(lines):
                    line = lines[i]
                    if line.startswith('@@ '):
                        body = []
                        i += 1
                        while i < len(lines) and not lines[i].startswith('@@ ') and not lines[i].startswith('diff --git '):
                            body.append(lines[i])
                            i += 1
                        old_count = sum(1 for x in body if x.startswith((' ', '-')))
                        new_count = sum(1 for x in body if x.startswith((' ', '+')))
                        m = re.match(r'@@ -(\\d+)(?:,\\d+)? \\+(\\d+)(?:,\\d+)? @@(.*)', line)
                        if not m:
                            raise SystemExit(f'Invalid hunk header in {path}: {line}')
                        out.append(f'@@ -{m.group(1)},{old_count} +{m.group(2)},{new_count} @@{m.group(3)}')
                        out.extend(body)
                    else:
                        out.append(line)
                        i += 1
                path.write_text('\n'.join(out) + '\n')
            PY
            for patch in $(find .github -maxdepth 1 -type f -name 'dup-*.patch' | sort); do
              git apply --check "$patch"
              git apply "$patch"
            done
            rm -f .github/dup-*.patch .github/duplicate-resolution-apply.patch .github/workflows/apply-duplicate-resolution.yml
            git restore --source=origin/main -- .github/workflows/ci.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: resolve duplicate historical source messages"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pip-audit

      - name: Lint critical Python errors
        run: flake8 src ai_service --select=E9,F63,F7,F82

      - name: Security (Bandit high severity)
        run: bandit -r src ai_service -q --severity-level high

      - name: Dependencies audit
        run: pip-audit -r requirements.txt

      - name: Compile
        run: python -m compileall -q src ai_service

      - name: Alembic heads
        run: PYTHONPATH=src alembic heads

      - name: Verify single Alembic head
        run: PYTHONPATH=src python scripts/verify_alembic_single_head.py

      - name: G6 and Core tests
        run: pytest -q

  fresh-postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capitalguard
          POSTGRES_PASSWORD: capitalguard
          POSTGRES_DB: capitalguard_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalguard -d capitalguard_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://capitalguard:capitalguard@localhost:5432/capitalguard_fresh
      API_KEY: test_api_key
      TELEGRAM_BOT_TOKEN: 123:fake_token
      ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply Alembic to empty PostgreSQL database
        run: PYTHONPATH=src alembic upgrade head
      - name: Verify fresh schema
        run: PYTHONPATH=src python scripts/verify_fresh_postgres_migration.py
      - name: Verify reconciliation
        env:
          RECONCILIATION_EXPECTED_DB: capitalguard_fresh
        run: PYTHONPATH=src python scripts/reconcile_existing_data.py
      - name: Verify G5 PostgreSQL concurrency
        run: PYTHONPATH=src:. python scripts/verify_g5_postgres_concurrency.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Frontend tests
        run: pnpm test
      - name: Production build
        run: pnpm build
