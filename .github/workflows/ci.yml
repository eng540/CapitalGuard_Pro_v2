name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./dev.db
      API_KEY: test_api_key
      TELEGRAM_BOT_TOKEN: 123:fake_token
      ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply duplicate-resolution contract correction
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/duplicate-resolution-from-main'
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          python -c 'from pathlib import Path; import re; p=Path("src/capitalguard/interfaces/telegram/presentation_adapter.py"); s=p.read_text(); p.write_text(re.sub(r"\\n(?=[ \\t]+)", "\\n", s))'
          python -c 'from pathlib import Path; p=Path("src/capitalguard/application/services/historical_forwarding_service.py"); s=p.read_text(); s=s.replace("HistoricalCanonicalMessage.source_kind == HistoricalForwardingService.SOURCE_KIND,", "HistoricalCanonicalMessage.source_kind == \"TELEGRAM\","); p.write_text(s)'
          python -m py_compile src/capitalguard/interfaces/telegram/presentation_adapter.py src/capitalguard/application/services/historical_forwarding_service.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capitalguard/interfaces/telegram/presentation_adapter.py src/capitalguard/application/services/historical_forwarding_service.py
          if ! git diff --cached --quiet; then git commit -m "fix: resolve canonical Telegram duplicate identity"; git push origin HEAD:"$GITHUB_HEAD_REF"; fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pip-audit
      - name: Lint critical Python errors
        run: flake8 src ai_service --select=E9,F63,F7,F82
      - name: Compile
        run: python -m compileall -q src ai_service
      - name: Targeted duplicate tests
        run: pytest -q tests/test_historical_forwarding_auto_progression.py tests/test_presentation_adapter.py
      - name: Full Core tests
        run: pytest -q
