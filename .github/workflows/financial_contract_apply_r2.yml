name: Financial Trading Reality Contract R2

on:
  push:
    branches:
      - fix/financial-trading-reality-contract-r2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'financial contract:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/financial-trading-reality-contract-r2
          fetch-depth: 0

      - name: Apply minimal financial semantics corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # C-02/C-03: one canonical unleveraged price-return definition.
          metrics = root / 'src/capitalguard/domain/financial_metrics.py'
          metrics.parent.mkdir(parents=True, exist_ok=True)
          metrics.write_text('''from __future__ import annotations\n\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Any\n\n\ndef price_return_pct(entry: Any, exit_price: Any, side: Any) -> Decimal:\n    """Canonical unleveraged price-return percentage used across CapitalGuard.\n\n    This is price return only; it does not represent realized monetary PnL,\n    leverage, fees, funding, quantity, allocation, or exchange execution.\n    """\n    try:\n        entry_dec = entry if isinstance(entry, Decimal) else Decimal(str(entry))\n        exit_dec = exit_price if isinstance(exit_price, Decimal) else Decimal(str(exit_price))\n        side_value = getattr(side, "value", side)\n        side_upper = str(side_value or "").upper()\n        if not entry_dec.is_finite() or entry_dec <= 0 or not exit_dec.is_finite():\n            return Decimal("0")\n        if side_upper == "LONG":\n            return ((exit_dec - entry_dec) / entry_dec) * Decimal("100")\n        if side_upper == "SHORT":\n            return ((entry_dec - exit_dec) / entry_dec) * Decimal("100")\n        return Decimal("0")\n    except (InvalidOperation, TypeError, ValueError, ZeroDivisionError):\n        return Decimal("0")\n''', encoding='utf-8')

          # Replace the known top-level _pct helpers with a thin wrapper over the canonical metric.
          pct_files = [
              'src/capitalguard/application/services/trade_service.py',
              'src/capitalguard/application/services/lifecycle_service.py',
              'src/capitalguard/application/services/analytics_service.py',
              'src/capitalguard/interfaces/telegram/helpers.py',
              'src/capitalguard/interfaces/telegram/keyboards.py',
          ]
          pct_body = '''def _pct(entry: Any, target_price: Any, side: str) -> float:\n    from capitalguard.domain.financial_metrics import price_return_pct\n    return float(price_return_pct(entry, target_price, side))\n\n'''
          for name in pct_files:
              p = root / name
              text = p.read_text(encoding='utf-8')
              pattern = re.compile(r'^def _pct\(entry: Any, target_price: Any, side: str\) -> float:\n.*?(?=^def |^class |\Z)', re.M | re.S)
              new, n = pattern.subn(pct_body, text, count=1)
              if n != 1:
                  raise SystemExit(f'Expected exactly one _pct in {name}, found {n}')
              p.write_text(new, encoding='utf-8')

          # Canonicalize the two Decimal-returning analyst PnL helpers.
          for name in [
              'src/capitalguard/application/services/analyst_comparison_service.py',
              'src/capitalguard/application/services/analyst_discovery_service.py',
          ]:
              p = root / name
              text = p.read_text(encoding='utf-8')
              pattern = re.compile(r'^    @staticmethod\n    def _pnl_pct\(recommendation: Recommendation\) -> Decimal \| None:\n.*?(?=^    def |^    @staticmethod\n    def |\Z)', re.M | re.S)
              replacement = '''    @staticmethod\n    def _pnl_pct(recommendation: Recommendation) -> Decimal | None:\n        if recommendation.exit_price is None or recommendation.entry is None:\n            return None\n        from capitalguard.domain.financial_metrics import price_return_pct\n        return price_return_pct(recommendation.entry, recommendation.exit_price, recommendation.side)\n\n'''
              new, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f'Expected exactly one _pnl_pct in {name}, found {n}')
              p.write_text(new, encoding='utf-8')

          # C-03: the Telegram target-return formatter uses the same canonical price-return semantics.
          p = root / 'src/capitalguard/interfaces/formatting/telegram_templates.py'
          text = p.read_text(encoding='utf-8')
          old = '''            if side.upper() == "LONG":\n                pct = (t - entry) / entry * 100\n            else:\n                pct = (entry - t) / entry * 100\n'''
          if old in text:
              text = text.replace(old, '''            from capitalguard.domain.financial_metrics import price_return_pct\n            pct = float(price_return_pct(entry, t, side))\n''', 1)
              p.write_text(text, encoding='utf-8')

          # C-01/C-08: activation is a lifecycle/price condition, not exchange execution.
          p = root / 'src/capitalguard/interfaces/telegram/ui_texts.py'
          text = p.read_text(encoding='utf-8')
          if 'return "⚡ <b>ACTIVE</b>\\nMarket Order Filled"' not in text:
              raise SystemExit('C-01 UI violation text not found')
          text = text.replace(
              'return "⚡ <b>ACTIVE</b>\\nMarket Order Filled"',
              'return "⚡ <b>ACTIVE</b>\\nEntry condition activated\\nExecution not verified"',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # C-04: retain additive metric for compatibility but represent it as an aggregate trade PnL score.
          for name in [
              'src/capitalguard/interfaces/telegram/commands.py',
              'src/capitalguard/interfaces/telegram/ui_texts.py',
              'docs/metrics_contract.md',
          ]:
              p = root / name
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('Total PnL %', 'Aggregate Trade PnL Score %')
              text = text.replace('Total PnL', 'Aggregate Trade PnL Score')
              text = text.replace('PnL: {record[\'total_pnl_pct\']:.2f}%', 'Aggregate trade PnL score: {record[\'total_pnl_pct\']:.2f}%')
              p.write_text(text, encoding='utf-8')

          # C-06/C-07: OHLC fallback is explicitly unverifiable; no SL_FIRST historical fact.
          p = root / 'src/capitalguard/infrastructure/market/intra_candle_resolver.py'
          p.write_text('''from __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\nfrom typing import Any\n\n\n@dataclass(frozen=True)\nclass AmbiguityResolution:\n    event: str\n    resolution: str\n    reason: str\n    confidence: Decimal\n    details: dict[str, Any]\n\n\nclass IntraCandleResolver:\n    """Single-candle conflict resolver; it owns no replay state."""\n\n    def __init__(self, client):\n        self.client = client\n\n    @staticmethod\n    def _hit(side, price, level):\n        return price >= level if side.upper() == "LONG" else price <= level\n\n    @staticmethod\n    def _stop(side, price, level):\n        return price <= level if side.upper() == "LONG" else price >= level\n\n    @staticmethod\n    def _trade_key(trade: dict) -> tuple:\n        timestamp = trade.get("timestamp")\n        trade_id = trade.get("trade_id")\n        return timestamp, int(trade_id) if trade_id is not None else 0\n\n    def resolve(self, *, symbol, market, side, candle_open, candle_close, stop, target_levels, candle_high, candle_low):\n        start = candle_open.astimezone(timezone.utc)\n        end = candle_close.astimezone(timezone.utc)\n        try:\n            trades = self.client.fetch_agg_trades(symbol=symbol, start=start, end=end, market=market or "SPOT", limit=1000)\n        except Exception as exc:\n            return self._fallback(side, stop, target_levels, start, candle_high, candle_low, f"AGG_TRADES_UNAVAILABLE:{type(exc).__name__}")\n\n        ordered = sorted(\n            (\n                trade\n                for trade in trades\n                if isinstance(trade, dict)\n                and isinstance(trade.get("timestamp"), datetime)\n                and start <= trade["timestamp"].astimezone(timezone.utc) <= end\n            ),\n            key=self._trade_key,\n        )\n        for trade in ordered:\n            price = Decimal(str(trade["price"]))\n            hits = [i for i, level in target_levels if self._hit(side, price, level)]\n            details = {\n                "timestamp": trade["timestamp"].astimezone(timezone.utc).isoformat(),\n                "price": str(price),\n                "trade_id": trade.get("trade_id"),\n                "target_indices": hits,\n            }\n            if self._stop(side, price, stop):\n                return AmbiguityResolution("SL", "VERIFIED_EVENT", "AGG_TRADES", Decimal("1"), details)\n            if hits:\n                return AmbiguityResolution(f"TP{hits[0]}", "VERIFIED_EVENT", "AGG_TRADES", Decimal("1"), details)\n        return self._fallback(side, stop, target_levels, start, candle_high, candle_low, "AGG_TRADES_EMPTY_OR_NO_TRIGGER")\n\n    @staticmethod\n    def _fallback(side, stop, target_levels, candle_open, high, low, reason):\n        collided = [i for i, level in target_levels if (high >= level if side.upper() == "LONG" else low <= level)]\n        stop_touched = low <= stop if side.upper() == "LONG" else high >= stop\n        observed = {\n            "candle_time": candle_open.isoformat(),\n            "high": str(high),\n            "low": str(low),\n            "stop": str(stop),\n            "stop_touched": stop_touched,\n            "collided_target_indices": collided,\n        }\n        if stop_touched or collided:\n            return AmbiguityResolution(\n                "AMBIGUOUS",\n                "UNVERIFIABLE",\n                reason,\n                Decimal("0"),\n                {**observed, "possible_events": (["SL"] if stop_touched else []) + [f"TP{i}" for i in collided]},\n            )\n        return AmbiguityResolution(\n            "NONE",\n            "NO_TRIGGER",\n            reason,\n            Decimal("1"),\n            observed,\n        )\n''', encoding='utf-8')

          # C-07: do not materialize an unverifiable resolver result as a lifecycle event.
          p = root / 'src/capitalguard/application/services/historical_market_replay_service.py'
          text = p.read_text(encoding='utf-8')
          old = 'event_type=resolution.event; event_price=stop if event_type=="SL" else target_levels[int(event_type[2:])-1]; replay_status="VERIFIED" if resolution.resolution=="VERIFIED_EVENT" else "INFERRED"; ambiguity_status="NONE" if resolution.resolution=="VERIFIED_EVENT" else "INFERRED"'
          if old not in text:
              raise SystemExit('Replay resolver materialization line not found')
          new = '''if resolution.resolution == "UNVERIFIABLE":\n                    events.append(self.signal_service.record_event(session,signal_id=signal.id,event_type="AMBIGUOUS",event_timestamp=candle_time,market_as_of=candle_time,data_source=market_evidence.data_source if market_evidence else None,price=None,replay_status="UNVERIFIABLE",event_confidence="0.0000",event_data={"replay_end":end_time.isoformat(),"replay_run_id":replay_run_id,"chronology":"UNVERIFIABLE","possible_events":resolution.details.get("possible_events", []),"observed":resolution.details},dedup_key=f"{dedup_prefix}:AMBIGUOUS:{candle_time.isoformat()}",replay_run_id=replay_run_id,refresh_ranking=refresh_ranking)); continue\n                if resolution.resolution == "NO_TRIGGER":\n                    continue\n                event_type=resolution.event; event_price=stop if event_type=="SL" else target_levels[int(event_type[2:])-1]; replay_status="VERIFIED"; ambiguity_status="NONE"'''
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # C-05: queue saturation must not discard the oldest lifecycle-triggering observation.
          p = root / 'src/capitalguard/application/services/alert_service.py'
          text = p.read_text(encoding='utf-8')
          old_block = '''        try:\n            q.put_nowait(payload)\n        except asyncio.QueueFull:\n            # الـ queue ممتلئة → تجاهل أقدم تيك واستبدله بالجديد\n            # التيك القديم بيانات منتهية الصلاحية — الجديد أدق\n            try:\n                q.get_nowait()\n            except asyncio.QueueEmpty:\n                pass\n            try:\n                q.put_nowait(payload)\n            except asyncio.QueueFull:\n                pass  # لا يحدث عملياً\n'''
          if old_block not in text:
              raise SystemExit('Queue-drop block not found')
          new_block = '''        # Preserve every observation at this lifecycle boundary. Backpressure is\n        # preferable to silently discarding a tick that can prove ENTRY/SL/TP.\n        await q.put(payload)\n'''
          text = text.replace(old_block, new_block, 1)
          p.write_text(text, encoding='utf-8')

          # Existing resolver tests described the prohibited fallback as correct. Update only those\n          # assertions to encode the corrected real-world rule, and add independent contract tests.
          for name in ['tests/test_g6_temporal_upgrade.py', 'tests/test_g6_intra_candle_resolver.py']:
              p = root / name
              if p.exists():
                  text = p.read_text(encoding='utf-8')
                  text = text.replace('assert result.event == "SL"', 'assert result.event == "AMBIGUOUS"')
                  text = text.replace('assert result.resolution == "PESSIMISTIC_FALLBACK"', 'assert result.resolution == "UNVERIFIABLE"')
                  text = text.replace('assert result.details["inferred_event"] == "SL_FIRST"', 'assert "possible_events" in result.details')
                  p.write_text(text, encoding='utf-8')

          test = root / 'tests/test_financial_trading_reality_contract.py'
          test.write_text('''from decimal import Decimal\n\nfrom capitalguard.domain.financial_metrics import price_return_pct\nfrom capitalguard.infrastructure.market.intra_candle_resolver import IntraCandleResolver\n\n\ndef test_c02_canonical_pnl_examples_and_direction_invariants():\n    assert price_return_pct(100, 110, "LONG") == Decimal("10")\n    assert price_return_pct(100, 90, "LONG") == Decimal("-10")\n    assert price_return_pct(100, 90, "SHORT") == Decimal("10")\n    assert price_return_pct(100, 110, "SHORT") == Decimal("-10")\n\n\ndef test_c06_c07_ambiguous_ohlc_is_unverifiable():\n    class Client:\n        def fetch_agg_trades(self, **kwargs):\n            raise RuntimeError("historical data unavailable")\n\n    result = IntraCandleResolver(Client()).resolve(\n        symbol="BTCUSDT", market="FUTURES", side="LONG",\n        candle_open=__import__("datetime").datetime(2025, 12, 4, 20, 38, tzinfo=__import__("datetime").timezone.utc),\n        candle_close=__import__("datetime").datetime(2025, 12, 4, 20, 39, tzinfo=__import__("datetime").timezone.utc),\n        stop=Decimal("80"), target_levels=[(1, Decimal("110"))],\n        candle_high=Decimal("115"), candle_low=Decimal("75"),\n    )\n    assert result.event == "AMBIGUOUS"\n    assert result.resolution == "UNVERIFIABLE"\n    assert "SL_FIRST" not in str(result.details)\n\n\ndef test_c06_fine_grain_evidence_can_prove_chronology():\n    class Client:\n        def fetch_agg_trades(self, **kwargs):\n            from datetime import datetime, timezone\n            return [{"timestamp": datetime(2025, 12, 4, 20, 38, 10, tzinfo=timezone.utc), "price": "75", "trade_id": 1}]\n\n    result = IntraCandleResolver(Client()).resolve(\n        symbol="BTCUSDT", market="FUTURES", side="LONG",\n        candle_open=__import__("datetime").datetime(2025, 12, 4, 20, 38, tzinfo=__import__("datetime").timezone.utc),\n        candle_close=__import__("datetime").datetime(2025, 12, 4, 20, 39, tzinfo=__import__("datetime").timezone.utc),\n        stop=Decimal("80"), target_levels=[(1, Decimal("110"))],\n        candle_high=Decimal("115"), candle_low=Decimal("75"),\n    )\n    assert result.event == "SL"\n    assert result.resolution == "VERIFIED_EVENT"\n''', encoding='utf-8')
          PY

      - name: Run contract regression tests
        run: |
          python -m pytest -q tests/test_financial_trading_reality_contract.py tests/test_g6_intra_candle_resolver.py tests/test_g6_temporal_upgrade.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "financial contract: implement proven reality corrections"
          git push origin HEAD:fix/financial-trading-reality-contract-r2
