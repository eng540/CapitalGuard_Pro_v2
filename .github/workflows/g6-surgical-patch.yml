name: g6-surgical-patch
on:
  push:
    branches:
      - fix/g6-production-closure-final-residual-closure
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply surgical G6 residual fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replay = Path('src/capitalguard/application/services/historical_market_replay_service.py')
          s = replay.read_text()
          old = '        start_utc, end_utc = self._utc(start), self._utc(replay_end)\n'
          new = '''        start_utc = self._utc(start)\n        requested_replay_end = self._utc(replay_end)\n        effective_replay_end = min(requested_replay_end, datetime.now(timezone.utc))\n        end_utc = effective_replay_end\n'''
          if old not in s:
              raise SystemExit('future-boundary anchor not found')
          s = s.replace(old, new, 1)

          old = '''        logging.getLogger(__name__).info(\n            "G6 replay decision action=%s reason=%s previous_run=%s previous_status=%s previous_version=%s current_version=%s previous_policy=%s current_policy=%s coverage=%s",\n            decision.action.value, decision.reason.value, decision.previous_run_id,\n            decision.previous_status, decision.previous_replay_version,\n            decision.current_replay_version, decision.previous_policy_version,\n            decision.current_policy_version, decision.coverage.reason,\n        )\n\n        if not decision.is_reprocess and previous is not None:\n            return {\n                "run": previous,\n                "events": list(previous.events or []),\n                "status": previous.status,\n                "replayed": True,\n                "retry_skipped": True,\n                "decision": decision,\n            }\n'''
          new = '''        def emit_decision_audit(run=None):\n            audit = decision.audit_record(\n                batch_id=getattr(receipt, "batch_id", None),\n                receipt_id=receipt.id,\n                signal_id=signal.id,\n                materialization_id=materialization.id,\n                new_run_id=(getattr(run, "id", None) if decision.is_reprocess else None),\n                new_fingerprint=(getattr(run, "request_fingerprint", None) if decision.is_reprocess else None),\n                lineage_parent=(getattr(previous, "id", None) if decision.is_reprocess else None),\n            )\n            logging.getLogger(__name__).info(\n                "G6_REPLAY_AUDIT %s", json.dumps(audit, sort_keys=True, default=str)\n            )\n            return audit\n\n        if not decision.is_reprocess and previous is not None:\n            audit = emit_decision_audit(previous)\n            return {\n                "run": previous,\n                "events": list(previous.events or []),\n                "status": previous.status,\n                "replayed": True,\n                "retry_skipped": True,\n                "decision": decision,\n                "audit_record": audit,\n            }\n'''
          if old not in s:
              raise SystemExit('decision-audit anchor not found')
          s = s.replace(old, new, 1)

          old = '''        result["decision"] = decision\n        return result\n'''
          new = '''        result["decision"] = decision\n        result["audit_record"] = emit_decision_audit(result.get("run"))\n        return result\n'''
          if old not in s:
              raise SystemExit('post-replay audit anchor not found')
          s = s.replace(old, new, 1)
          replay.write_text(s)

          handler = Path('src/capitalguard/interfaces/telegram/forward_parsing_handler.py')
          s = handler.read_text()
          start = s.index('async def smart_safe_edit(\n')
          end = s.index('\n# --- Entry Point 1: Text Forward ---', start)
          new_func = '''async def smart_safe_edit(\n    bot: Bot, chat_id: int, message_id: int,\n    text: str = None, reply_markup=None, parse_mode: str = ParseMode.HTML\n) -> bool:\n    """Edit a Telegram message with bounded retries and no application replay side effects."""\n    max_attempts = 3\n    backoff_seconds = (0.25, 0.5)\n    current_parse_mode = parse_mode\n    clean_text = re.sub(r'<[^>]+>', '', text or "")\n\n    for attempt in range(1, max_attempts + 1):\n        try:\n            await bot.edit_message_text(\n                chat_id=chat_id, message_id=message_id, text=(clean_text if current_parse_mode is None else text),\n                reply_markup=reply_markup, parse_mode=current_parse_mode,\n                disable_web_page_preview=True,\n            )\n            return True\n        except BadRequest as e:\n            message = str(e).lower()\n            if "message is not modified" in message:\n                return True\n            if ("can't parse entities" in message or "unsupported start tag" in message) and current_parse_mode is not None:\n                current_parse_mode = None\n                continue\n            loge.warning(f"Handled BadRequest in smart_safe_edit attempt {attempt}/{max_attempts} for {chat_id}:{message_id}: {e}")\n        except TelegramError as e:\n            loge.warning(f"TelegramError in smart_safe_edit attempt {attempt}/{max_attempts} for {chat_id}:{message_id}: {e}")\n        except Exception as e_other:\n            loge.exception(f"Unexpected error in smart_safe_edit attempt {attempt}/{max_attempts} for {chat_id}:{message_id}: {e_other}")\n\n        if attempt < max_attempts:\n            await asyncio.sleep(backoff_seconds[attempt - 1])\n\n    loge.error(f"smart_safe_edit exhausted {max_attempts} attempts for {chat_id}:{message_id}")\n    return False\n'''
          if 'import asyncio\n' not in s:
              s = s.replace('import logging\n', 'import asyncio\nimport logging\n', 1)
          s = s[:start] + new_func + s[end:]
          handler.write_text(s)
          PY

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_g6_production_closure_residual_gaps.py \
            tests/test_g6_reprocessing_decision_authority.py \
            tests/test_historical_market_replay_service.py \
            tests/test_g6_post_410_regression.py

      - name: Commit surgical fixes and remove patch workflow
        run: |
          rm -f .github/workflows/g6-surgical-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/capitalguard/application/services/historical_market_replay_service.py src/capitalguard/interfaces/telegram/forward_parsing_handler.py .github/workflows/g6-surgical-patch.yml
          git diff --cached --check
          git commit -m 'fix(g6): close residual replay and telegram lifecycle gaps'
          git push origin HEAD:${GITHUB_REF_NAME}
PY
