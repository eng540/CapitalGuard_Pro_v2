name: G6 Final Regression Runner
on:
  push:
    branches: [fix/g6-lifecycle-and-historical-result-presentation]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g6-lifecycle-and-historical-result-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fix parser and align G6 assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_service/services/parsing_utils.py'); s=p.read_text()
          old='''        # Reject semantic labels / clock timestamps before stripping punctuation.\n        if re.fullmatch(r"(?:tp|target)\\d*", s, flags=re.IGNORECASE):\n            return None\n        if re.fullmatch(r"(?:[01]?\\d|2[0-3]):[0-5]\\d", s):\n            return None\n'''
          new='''        # Reject semantic labels / clock timestamps before stripping punctuation.\n        if re.fullmatch(r"(?:tp|target)\\d*[:=\\-]?", s, flags=re.IGNORECASE):\n            return None\n        if re.fullmatch(r"(?:[01]?\\d|2[0-3]):[0-5]\\d", s):\n            return None\n'''
          if old not in s: raise SystemExit('parser guard not found')
          p.write_text(s.replace(old,new,1))
          p=Path('tests/test_g6_annual_macro_replay.py'); s=p.read_text(); s=s.replace('assert result["status"] == "COMPLETED"\n    assert len(provider.daily_calls) == 1', 'assert result["status"] == "REPLAY_PARTIAL"\n    assert len(provider.daily_calls) == 1',1).replace('assert result["status"] == "COMPLETED"\n    assert len(provider.daily_calls) == 2', 'assert result["status"] == "REPLAY_PARTIAL"\n    assert len(provider.daily_calls) == 2',1); p.write_text(s)
          PY
      - name: Full regression
        run: pytest -q
      - name: Compile and diff check
        run: python -m compileall -q src ai_service && git diff --check
      - name: Commit tested changes and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_service/services/parsing_utils.py tests/test_g6_annual_macro_replay.py
          git commit -m 'fix(g6): repair parser label normalization and regression assertions'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
          git rm .github/workflows/g6-final-runner.yml
          git commit -m 'chore(g6): remove final regression runner'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
