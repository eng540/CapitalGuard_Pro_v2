name: G6 CI surgical fix
on:
  push:
    branches:
      - feature/g6-annual-adaptive-replay
permissions:
  contents: write
jobs:
  fix:
    if: github.ref_name == 'feature/g6-annual-adaptive-replay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/g6-annual-adaptive-replay
          fetch-depth: 1
      - name: Surgical patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/capitalguard/application/services/historical_market_replay_service.py')
          s = p.read_text()
          old = '            replay_run_ref = run.run_ref\n'
          new = '            replay_run_ref = f"HMKT-{uuid4().hex[:24].upper()}"\n'
          if old not in s:
              raise SystemExit('expected replay_run_ref assignment not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/capitalguard/application/services/historical_market_replay_service.py
      - name: Commit surgical patch and remove fixer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/capitalguard/application/services/historical_market_replay_service.py
          git commit -m 'fix(g6): keep evidence refs unique within replay run'
          git push origin HEAD:feature/g6-annual-adaptive-replay
          rm .github/workflows/g6-ci-fix.yml
          git add .github/workflows/g6-ci-fix.yml
          git commit -m 'chore(ci): remove temporary g6 fixer'
          git push origin HEAD:feature/g6-annual-adaptive-replay
