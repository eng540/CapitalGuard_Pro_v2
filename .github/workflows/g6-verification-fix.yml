name: G6 Verification Fix
on:
  push:
    branches: [fix/g6-lifecycle-and-historical-result-presentation]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g6-lifecycle-and-historical-result-presentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fix G6 replay lifecycle labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/capitalguard/application/services/historical_market_replay_service.py')
          s = p.read_text()
          s2 = s.replace('run.status in {"COMPLETED", "COMPLETED_UNVERIFIABLE", "STILL_ACTIVE"}', 'run.status in {"COMPLETED", "COMPLETED_UNVERIFIABLE"}')
          s2 = s2.replace('lifecycle = "CLOSED_TARGETS" if len(hit) == len(target_levels) else "ACTIVE"', 'lifecycle = "CLOSED_TARGETS" if len(hit) == len(target_levels) else "ACTIVE_POSITION"')
          if s2 == s:
              raise SystemExit('no replay lifecycle changes found')
          p.write_text(s2)
          PY
      - name: Historical regression after replay fix
        run: pytest -q tests/test_historical_*
      - name: Compile and diff check after replay fix
        run: python -m compileall -q src ai_service && git diff --check
      - name: Commit replay fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/capitalguard/application/services/historical_market_replay_service.py
          git commit -m 'fix(g6): remove stale replay lifecycle labels'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
      - name: Fix forwarding lifecycle labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/capitalguard/application/services/historical_forwarding_service.py')
          s = p.read_text()
          s2 = s.replace('return "CLOSED_SL"', 'return "CLOSED_STOP"').replace('return "CLOSED_SOURCE"', 'return "CLOSED_UNVERIFIABLE"')
          if s2 == s:
              raise SystemExit('no forwarding lifecycle changes found')
          p.write_text(s2)
          PY
      - name: Historical regression after forwarding fix
        run: pytest -q tests/test_historical_*
      - name: Compile and diff check after forwarding fix
        run: python -m compileall -q src ai_service && git diff --check
      - name: Commit forwarding fix
        run: |
          git add src/capitalguard/application/services/historical_forwarding_service.py
          git commit -m 'fix(g6): align forwarding lifecycle contract'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
      - name: Remove one-shot fixer
        run: |
          git rm .github/workflows/g6-verification-fix.yml
          git commit -m 'chore(g6): remove one-shot verification fixer'
          git push origin HEAD:fix/g6-lifecycle-and-historical-result-presentation
